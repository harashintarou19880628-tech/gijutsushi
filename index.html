<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>技術士第二次試験 フラッシュカード</title>
</head>
<body>
<div id="fc-root">
<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;">技術士第二次試験 答案復習用フラッシュカード。科目・デッキを選び、カードをクリックすると表(概念)と裏(詳細)が切り替わります。</h2>

<div id="fc-timer-bar">
  <span id="fc-timer-display">02:00:00</span>
  <input type="number" id="fc-timer-minutes" min="1" max="300" value="120" aria-label="タイマー分数">
  <button id="fc-timer-start">試験タイマー開始</button>
  <button id="fc-timer-pause" style="display:none;">一時停止</button>
  <button id="fc-timer-reset">リセット</button>
</div>

<div id="fc-subject-bar">
  <button class="fc-subject-btn" data-subject="hisu1">必須Ⅰ</button>
  <button class="fc-subject-btn" data-subject="sentaku2-1">選択Ⅱ-1</button>
  <button class="fc-subject-btn" data-subject="sentaku2-2">選択Ⅱ-2</button>
  <button class="fc-subject-btn" data-subject="sentaku3">選択Ⅲ</button>
  <button class="fc-subject-btn" data-subject="kyotsu">共通チェック</button>
</div>

<div id="fc-empty-subject" style="display:none;">
  <div class="fc-empty-msg">この科目のカードはまだ準備中です。追加され次第ここに表示されます。</div>
</div>

<div id="fc-study-area">
  <div id="fc-mode-bar">
    <button id="fc-mode-full" class="fc-mode-btn">全文モード</button>
    <button id="fc-mode-cloze" class="fc-mode-btn">穴埋めモード</button>
  </div>
  <div id="fc-today-banner" style="display:none;">
    <span id="fc-today-banner-text"></span>
    <button id="fc-today-banner-btn">開く</button>
  </div>
  <button id="fc-deck-picker-btn" aria-label="デッキを選択">
    <span id="fc-deck-picker-label">デッキを選択</span>
    <span id="fc-deck-picker-arrow">▾</span>
  </button>
  <div id="fc-status"></div>
  <div id="fc-stats-line"></div>
  <div id="fc-card-wrap">
    <div id="fc-card-toolbar">
      <button id="fc-explain-btn" style="display:none;">🔍 かんたん解説</button>
      <button id="fc-mark" aria-label="このカードを苦手としてマーク">☆ 苦手</button>
    </div>
    <div id="fc-card">
      <div id="fc-card-inner">
        <div id="fc-face-front" class="fc-face"></div>
        <div id="fc-face-back" class="fc-face fc-face-back"></div>
      </div>
    </div>
  </div>
  <div id="fc-rate-bar">
    <button class="fc-rate-btn fc-rate-bad" data-grade="bad">✕ できなかった</button>
    <button class="fc-rate-btn fc-rate-meh" data-grade="meh">△ 怪しい</button>
    <button class="fc-rate-btn fc-rate-ok" data-grade="ok">○ できた</button>
  </div>
  <div id="fc-nav">
    <button id="fc-prev" aria-label="前のカード">‹ 前</button>
    <button id="fc-flip">回答を見る</button>
    <button id="fc-next" aria-label="次のカード">次 ›</button>
  </div>
  <div id="fc-tools">
    <button id="fc-shuffle">シャッフル</button>
    <button id="fc-clear-weak">苦手マークを解除</button>
    <button id="fc-edit-toggle">✏️ 編集</button>
    <button id="fc-stats-toggle">📊 成績</button>
    <button id="fc-cal-toggle">📅 カレンダー</button>
    <button id="fc-backup-export">💾 バックアップ</button>
    <button id="fc-backup-import-btn">📂 復元</button>
    <input type="file" id="fc-backup-import-input" accept="application/json,.json" style="display:none;">
    <span id="fc-hint">クリック / Spaceキーで裏返し、←→キーで移動</span>
  </div>
  <div id="fc-edit-panel" style="display:none;">
    <div id="fc-edit-title">このカードを編集</div>
    <label class="fc-edit-label" for="fc-edit-front">表(問題文)</label>
    <textarea id="fc-edit-front" rows="3"></textarea>
    <label class="fc-edit-label" for="fc-edit-back">裏(回答文) ― [[ ]]で囲んだ部分が穴埋め対象になります</label>
    <textarea id="fc-edit-back" rows="7"></textarea>
    <div id="fc-edit-blank-tools">
      <button id="fc-edit-wrap">選択範囲を空欄にする</button>
      <button id="fc-edit-unwrap">空欄を解除</button>
    </div>
    <div id="fc-edit-actions">
      <button id="fc-edit-save">保存</button>
      <button id="fc-edit-revert">元の文章に戻す</button>
      <button id="fc-edit-cancel">キャンセル</button>
    </div>
  </div>
  <div id="fc-stats-panel" style="display:none;">
    <div id="fc-stats-title">項目別の正答率(モード別)</div>
    <div id="fc-stats-content"></div>
    <button id="fc-stats-close">閉じる</button>
  </div>
  <div id="fc-cal-panel" style="display:none;">
    <div id="fc-cal-header">
      <button id="fc-cal-prev">‹</button>
      <div id="fc-cal-title"></div>
      <button id="fc-cal-next">›</button>
    </div>
    <div id="fc-cal-grid"></div>
    <div id="fc-cal-month-total"></div>
    <button id="fc-cal-close">閉じる</button>
  </div>
</div>
</div>

<div id="fc-glossary-overlay" style="display:none;">
  <div id="fc-glossary-modal">
    <button id="fc-glossary-close" aria-label="閉じる">✕</button>
    <div id="fc-glossary-title"></div>
    <div id="fc-glossary-svg"></div>
    <div id="fc-glossary-body"></div>
  </div>
</div>

<div id="fc-deck-picker-overlay" style="display:none;">
  <div id="fc-deck-picker-modal">
    <div id="fc-deck-picker-header">
      <span>デッキを選択</span>
      <button id="fc-deck-picker-close" aria-label="閉じる">✕</button>
    </div>
    <div id="fc-deck-picker-list"></div>
  </div>
</div>

<style>
body{margin:0;padding:1rem;background:#F7F5EF;}
#fc-root{font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#2B2B26;max-width:640px;margin:0 auto;padding:0.5rem 0 1rem;}

#fc-timer-bar{display:flex;align-items:center;gap:6px;margin-bottom:10px;padding:8px 10px;border:0.5px solid #D8D4C6;border-radius:10px;background:#FFFFFF;flex-wrap:wrap;}
#fc-timer-display{font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;color:#2B2B26;min-width:78px;}
#fc-timer-minutes{width:52px;font-size:12px;padding:5px;border-radius:6px;border:0.5px solid #D8D4C6;}
#fc-timer-bar button{font-size:12px;padding:6px 10px;border-radius:8px;border:0.5px solid #D8D4C6;background:#F7F5EF;color:#2B2B26;cursor:pointer;}
#fc-timer-start{background:#2F5D50 !important;color:#FFFFFF !important;border-color:#2F5D50 !important;}

#fc-subject-bar{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;cursor:grab;}
#fc-subject-bar.fc-dragging{cursor:grabbing;}
#fc-subject-bar::-webkit-scrollbar{height:4px;}
.fc-subject-btn{flex:0 0 auto;border:0.5px solid #D8D4C6;background:#FFFFFF;color:#5B5A50;font-size:12px;padding:9px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;}
.fc-subject-btn.active{background:#2F5D50;border-color:#2F5D50;color:#FFFFFF;font-weight:500;}
.fc-subject-btn.fc-subject-empty{color:#B0AEA0;}
.fc-subject-btn.fc-subject-empty.active{background:#8a8879;border-color:#8a8879;}

#fc-empty-subject{border:0.5px dashed #D8D4C6;border-radius:12px;padding:32px 16px;text-align:center;}
.fc-empty-msg{color:#8a8879;font-size:13px;line-height:1.7;}

#fc-deck-picker-btn{display:flex;align-items:center;justify-content:space-between;width:100%;border:0.5px solid #D8D4C6;background:#FFFFFF;color:#2B2B26;font-size:14px;font-weight:600;padding:11px 14px;border-radius:10px;cursor:pointer;margin-bottom:10px;box-sizing:border-box;text-align:left;}
#fc-deck-picker-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;margin-right:8px;}
#fc-deck-picker-arrow{color:#8a8879;flex:0 0 auto;font-size:12px;}
#fc-deck-picker-overlay{position:fixed;inset:0;background:rgba(20,20,16,0.55);display:flex;align-items:flex-end;justify-content:center;z-index:200;}
#fc-deck-picker-modal{position:relative;background:#FFFFFF;border-radius:16px 16px 0 0;padding:0;max-width:640px;width:100%;max-height:75vh;display:flex;flex-direction:column;box-sizing:border-box;}
#fc-deck-picker-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:0.5px solid #EDEBE2;font-size:15px;font-weight:600;color:#2B2B26;flex:0 0 auto;}
#fc-deck-picker-close{width:30px;height:30px;border-radius:999px;border:0.5px solid #D8D4C6;background:#F7F5EF;color:#5B5A50;font-size:14px;cursor:pointer;}
#fc-deck-picker-list{overflow-y:auto;padding:8px 12px 16px;}
.fc-deck-pick-btn{display:block;width:100%;text-align:left;border:0.5px solid #D8D4C6;background:#FFFFFF;color:#2B2B26;font-size:14px;padding:11px 14px;border-radius:10px;cursor:pointer;box-sizing:border-box;margin-bottom:6px;}
.fc-deck-pick-btn.active{background:#2F5D50;border-color:#2F5D50;color:#FFFFFF;}
#fc-mode-bar{display:flex;gap:6px;margin-bottom:10px;}
#fc-today-banner{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#E3F1E8;border:0.5px solid #B9DFC7;border-radius:10px;padding:9px 12px;margin-bottom:10px;font-size:12.5px;color:#245a3f;}
#fc-today-banner button{flex:0 0 auto;font-size:12px;padding:6px 12px;border-radius:8px;border:0.5px solid #2F5D50;background:#2F5D50;color:#FFFFFF;cursor:pointer;}
.fc-mode-btn{flex:1;border:0.5px solid #D8D4C6;background:#FFFFFF;color:#5B5A50;font-size:13px;padding:8px 0;border-radius:8px;cursor:pointer;}
.fc-mode-btn.active{background:#EDE9F7;border-color:#B9ADE0;color:#4a3a78;font-weight:500;}
#fc-status{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:#7A7868;margin:2px 2px 10px;}
#fc-status .fc-deck-title{font-size:14px;color:#2B2B26;font-weight:500;}
#fc-progress-track{background:#EAE7DB;border-radius:4px;height:4px;overflow:hidden;margin:0 2px 6px;}
#fc-progress-bar{background:#2F5D50;height:100%;width:0%;transition:width .2s ease;}
#fc-stats-line{font-size:12px;color:#8a8879;margin:0 2px 14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;}

#fc-card-wrap{perspective:1400px;margin-bottom:12px;}
#fc-card-toolbar{display:flex;align-items:center;margin-bottom:8px;}
#fc-mark{margin-left:auto;font-size:12px;padding:6px 11px;border-radius:999px;border:0.5px solid #D8D4C6;background:#FFFFFF;color:#8a8879;cursor:pointer;}
#fc-explain-btn{font-size:12px;padding:6px 11px;border-radius:999px;border:0.5px solid #1f6b5c;background:#DCF0EC;color:#1f6b5c;cursor:pointer;}
#fc-mark.active{background:#FCEFD8;border-color:#EACB8A;color:#8a5a12;}
#fc-card{position:relative;height:min(58vh, 440px);min-height:220px;outline:none;}
#fc-card:focus-visible #fc-card-inner{box-shadow:0 0 0 2px #2F5D50;}
#fc-card-inner{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
#fc-card.flipped #fc-card-inner{transform:rotateY(180deg);}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;background:#FFFFFF;border:0.5px solid #E1DDCF;border-radius:14px;padding:26px 24px;display:flex;flex-direction:column;box-sizing:border-box;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.fc-face-back{transform:rotateY(180deg);}
.fc-pill{align-self:flex-start;font-size:12px;padding:4px 10px;border-radius:999px;font-weight:500;margin-bottom:8px;}
.fc-card-accuracy{font-size:11px;color:#8a8879;margin-bottom:10px;}
.fc-front-title{font-size:19px;font-weight:500;line-height:1.55;}
.fc-cloze-heading{font-size:13px;color:#8a8879;font-weight:500;margin-bottom:12px;}
.fc-front-sub{font-size:13px;color:#8a8879;margin-top:10px;}
.fc-back-text{font-size:15px;line-height:1.85;color:#2B2B26;white-space:pre-line;}
.fc-back-note{font-size:12px;color:#8a8879;margin-top:14px;border-top:0.5px solid #EAE7DB;padding-top:10px;}
.fc-blank{display:inline-block;background:#EDE9F7;color:#4a3a78;border:none;border-bottom:2px dashed #B9ADE0;border-radius:4px;padding:0 6px;margin:0 1px;font:inherit;line-height:1.6;cursor:pointer;}
.fc-blank.revealed{background:#FCEFD8;color:#8a5a12;border-bottom:2px solid transparent;cursor:pointer;}

#fc-rate-bar{display:flex;gap:8px;margin-bottom:10px;}
.fc-rate-btn{flex:1;font-size:13px;padding:9px 0;border-radius:8px;border:0.5px solid #D8D4C6;background:#FFFFFF;color:#5B5A50;cursor:pointer;}
.fc-rate-btn:active{transform:scale(0.98);}
.fc-rate-bad{color:#8a3620;}
.fc-rate-meh{color:#8a5a12;}
.fc-rate-ok{color:#245a3f;}
.fc-rate-btn.flash{outline:2px solid currentColor;}

#fc-nav{display:flex;gap:8px;margin-bottom:10px;}
#fc-nav button{flex:1;font-size:14px;padding:10px 0;border-radius:8px;border:0.5px solid #D8D4C6;background:#FFFFFF;color:#2B2B26;cursor:pointer;}
#fc-nav button:active{transform:scale(0.98);}
#fc-flip{background:#2F5D50 !important;color:#FFFFFF !important;border-color:#2F5D50 !important;}
#fc-tools{display:flex;align-items:center;gap:10px;font-size:12px;color:#8a8879;flex-wrap:wrap;margin-bottom:10px;}
#fc-tools button{font-size:12px;padding:6px 12px;border-radius:8px;border:0.5px solid #D8D4C6;background:#FFFFFF;color:#5B5A50;cursor:pointer;}

#fc-stats-panel, #fc-cal-panel, #fc-edit-panel{border:0.5px solid #D8D4C6;border-radius:12px;padding:14px;background:#FFFFFF;margin-bottom:10px;}
#fc-edit-title{font-size:14px;font-weight:600;margin-bottom:10px;}
.fc-edit-label{display:block;font-size:11.5px;color:#8a8879;margin:10px 0 5px;}
#fc-edit-front, #fc-edit-back{width:100%;box-sizing:border-box;font-family:inherit;font-size:14px;line-height:1.6;padding:10px;border-radius:8px;border:0.5px solid #D8D4C6;background:#FAF9F5;color:#2B2B26;resize:vertical;}
#fc-edit-blank-tools{display:flex;gap:8px;margin-top:8px;}
#fc-edit-actions{display:flex;gap:8px;margin-top:14px;}
#fc-edit-blank-tools button, #fc-edit-actions button{flex:1;font-size:12.5px;padding:9px 0;border-radius:8px;border:0.5px solid #D8D4C6;background:#F7F5EF;color:#2B2B26;cursor:pointer;}
#fc-edit-save{background:#2F5D50 !important;color:#FFFFFF !important;border-color:#2F5D50 !important;}

.fc-term{display:inline;color:#204a78;border-bottom:1.5px dotted #204a78;cursor:pointer;font:inherit;}

#fc-glossary-overlay{position:fixed;inset:0;background:rgba(20,20,16,0.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:200;}
#fc-glossary-modal{position:relative;background:#FFFFFF;border-radius:14px;padding:20px;max-width:480px;width:100%;max-height:82vh;overflow-y:auto;box-sizing:border-box;}
#fc-glossary-close{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:999px;border:0.5px solid #D8D4C6;background:#F7F5EF;color:#5B5A50;font-size:14px;cursor:pointer;}
#fc-glossary-title{font-size:16px;font-weight:600;color:#2B2B26;margin:0 34px 12px 0;}
#fc-glossary-svg{margin-bottom:14px;border-radius:10px;overflow:hidden;}
#fc-glossary-svg svg{width:100%;height:auto;display:block;}
#fc-glossary-body{font-size:14px;line-height:1.8;color:#2B2B26;}
#fc-glossary-body p{margin:0 0 10px;}
#fc-glossary-body ul{margin:0 0 10px;padding-left:20px;}
#fc-glossary-body li{margin-bottom:6px;}
.fc-glossary-section-title{font-size:12px;font-weight:600;color:#2F5D50;margin:14px 0 6px;}
#fc-stats-title{font-size:14px;font-weight:600;margin-bottom:10px;}
.fc-stats-section-title{font-size:12px;font-weight:600;color:#2F5D50;margin:4px 0 8px;}
.fc-stats-divider{height:0.5px;background:#EAE7DB;margin:14px 0;}
.fc-stats-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;}
.fc-stats-label{width:96px;flex:0 0 96px;color:#5B5A50;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fc-stats-bar-track{flex:1;background:#EAE7DB;border-radius:4px;height:10px;overflow:hidden;}
.fc-stats-bar-fill{background:#2F5D50;height:100%;}
.fc-stats-pct{width:80px;flex:0 0 80px;text-align:right;color:#7A7868;}
#fc-stats-close, #fc-cal-close{margin-top:6px;font-size:12px;padding:6px 12px;border-radius:8px;border:0.5px solid #D8D4C6;background:#F7F5EF;color:#5B5A50;cursor:pointer;}

#fc-cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
#fc-cal-title{font-size:14px;font-weight:600;}
#fc-cal-header button{font-size:14px;padding:4px 12px;border-radius:8px;border:0.5px solid #D8D4C6;background:#F7F5EF;color:#2B2B26;cursor:pointer;}
#fc-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.fc-cal-weekday{font-size:10px;color:#8a8879;text-align:center;padding:2px 0 6px;}
.fc-cal-cell{aspect-ratio:1;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;}
.fc-cal-empty{visibility:hidden;}
.fc-cal-level-0{background:#EAE7DB;color:#8a8879;}
.fc-cal-level-1{background:#c9e4d8;color:#1f4a38;}
.fc-cal-level-2{background:#8fc7ab;color:#12291f;}
.fc-cal-level-3{background:#4d9a76;color:#ffffff;}
.fc-cal-level-4{background:#2F5D50;color:#ffffff;}
.fc-cal-today{outline:2px solid #2F5D50;outline-offset:1px;}
.fc-cal-daynum{font-weight:600;line-height:1.1;}
.fc-cal-count{font-size:8.5px;line-height:1.1;}
#fc-cal-month-total{font-size:12px;color:#8a8879;margin-top:10px;}

@media (prefers-color-scheme: dark){
  body{background:#151512;}
  #fc-root{color:#EDEBE2;}
  #fc-timer-bar{background:#1E1E1A;border-color:#3A3A34;}
  #fc-timer-display{color:#EDEBE2;}
  #fc-timer-minutes{background:#242420;border-color:#3A3A34;color:#EDEBE2;}
  #fc-timer-bar button{background:#242420;border-color:#3A3A34;color:#EDEBE2;}
  .fc-subject-btn{background:#242420;border-color:#3A3A34;color:#B8B6A9;}
  .fc-subject-btn.active{background:#4C8A76;border-color:#4C8A76;color:#0E1210;}
  .fc-subject-btn.fc-subject-empty{color:#6E6C60;}
  .fc-subject-btn.fc-subject-empty.active{background:#3A3A34;border-color:#3A3A34;color:#B8B6A9;}
  #fc-empty-subject{border-color:#3A3A34;}
  .fc-empty-msg{color:#8f8d7f;}
  .fc-mode-btn{background:#242420;border-color:#3A3A34;color:#B8B6A9;}
  .fc-mode-btn.active{background:#2a2338;border-color:#4a3a78;color:#c3b3ee;}
  #fc-today-banner{background:#16281f;border-color:#245a3f;color:#8fd6ac;}
  #fc-today-banner button{background:#4C8A76;border-color:#4C8A76;color:#0E1210;}
  #fc-status{color:#A6A497;}
  #fc-status .fc-deck-title{color:#EDEBE2;}
  #fc-stats-line{color:#8f8d7f;}
  #fc-progress-track{background:#2C2C27;}
  #fc-progress-bar{background:#4C8A76;}
  .fc-face{background:#1E1E1A;border-color:#3A3A34;}
  .fc-front-sub{color:#8f8d7f;}
  .fc-card-accuracy{color:#8f8d7f;}
  .fc-cloze-heading{color:#8f8d7f;}
  .fc-back-text{color:#EDEBE2;}
  .fc-back-note{color:#8f8d7f;border-top-color:#2C2C27;}
  .fc-blank{background:#2a2338;color:#c3b3ee;border-bottom-color:#4a3a78;}
  .fc-blank.revealed{background:#3a2c10;color:#f0c778;}
  .fc-rate-btn{background:#242420;border-color:#3A3A34;}
  .fc-rate-bad{color:#f0a48c;}
  .fc-rate-meh{color:#f0c778;}
  .fc-rate-ok{color:#8fd6ac;}
  #fc-nav button{background:#242420;border-color:#3A3A34;color:#EDEBE2;}

function shuffleArr(arr){
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function topicDecksFor(subjectId){
  return decks.filter(function(d){ return d.subject === subjectId; });
}

var weakSet = new Set();
var quizCache = {};

function buildAllDeck(subjectId){
  var topics = topicDecksFor(subjectId);
  var cards = [];
  topics.forEach(function(d){ cards = cards.concat(d.cards); });
  return {id: subjectId + '-all', subject: subjectId, title: '全体シャッフル(全' + cards.length + '枚)', cards: cards};
}
function buildWeakDeck(subjectId){
  var all = buildAllDeck(subjectId);
  var cards = all.cards.filter(function(cd){ return weakSet.has(cd.id); });
  return {id: subjectId + '-weak', subject: subjectId, title: '苦手カード(' + cards.length + ')', cards: cards};
}
function buildQuizDeck(subjectId){
  if (!quizCache[subjectId]){
    var all = buildAllDeck(subjectId);
    quizCache[subjectId] = shuffleArr(all.cards).slice(0, Math.min(10, all.cards.length));
  }
  return {id: subjectId + '-quiz', subject: subjectId, title: '🎲 抜き打ち10問', cards: quizCache[subjectId]};
}
function weaknessScore(cardId){
  var t = cardTallyFor(cardId, currentMode);
  var total = t.ok + t.meh + t.bad;
  if (total === 0) return { score: 0.5, total: 0 };
  return { score: (t.bad * 2 + t.meh * 1) / total, total: total };
}
function buildWeakPriorityDeck(subjectId){
  var all = buildAllDeck(subjectId);
  var scored = all.cards.map(function(cd){
    var w = weaknessScore(cd.id);
    return { card: cd, score: w.score, total: w.total };
  }).filter(function(x){ return x.total === 0 || x.score > 0; });
  scored.sort(function(a, b){ return b.score - a.score; });
  var cards = scored.map(function(x){ return x.card; });
  return {id: subjectId + '-priority', subject: subjectId, title: '🎯 弱点優先復習(' + cards.length + ')', cards: cards};
}
function getDeckList(subjectId){
  return [buildAllDeck(subjectId), buildWeakDeck(subjectId), buildQuizDeck(subjectId), buildWeakPriorityDeck(subjectId)].concat(topicDecksFor(subjectId));
}

var WEEKDAY_LABELS_MON_FIRST = ['月', '火', '水', '木', '金', '土', '日'];
function todayRecommendedDeck(subjectId){
  var topics = topicDecksFor(subjectId);
  if (topics.length === 0) return null;
  var mondayBased = (new Date().getDay() + 6) % 7;
  var idx = mondayBased % topics.length;
  var target = topics[idx];
  var dl = getDeckList(subjectId);
  var listIndex = dl.findIndex(function(d){ return d.id === target.id; });
  return { deck: target, listIndex: listIndex, weekdayLabel: WEEKDAY_LABELS_MON_FIRST[mondayBased] };
}

function sessionKey(subj, mode){ return subj + ':' + mode; }
var sessions = {};
var savedProgressMap = {};

function ensureSession(subj, mode){
  var key = sessionKey(subj, mode);
  if (sessions[key]) return sessions[key];
  var dl = getDeckList(subj);
  var n = dl[0].cards.length;
  var ord = []; for (var i = 0; i < n; i++) ord.push(i);
  var sess = { deckIdx: 0, order: ord, pos: 0, visited: new Set() };
  var saved = savedProgressMap[key];
  if (saved){
    var idx = dl.findIndex(function(d){ return d.id === saved.deckId; });
    if (idx === -1) idx = 0;
    sess.deckIdx = idx;
    var cards = dl[idx].cards;
    var nn = cards.length;
    var ord2 = []; for (var j = 0; j < nn; j++) ord2.push(j);
    sess.order = ord2;
    var foundPos = cards.findIndex(function(cd){ return cd.id === saved.cardId; });
    sess.pos = (nn > 0 && foundPos >= 0) ? foundPos : 0;
    sess.visited = new Set(saved.visited || []);
  }
  sessions[key] = sess;
  return sess;
}

function escapeAttr(s){
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderCardText(text, cardId, clozeMode){
  var re = /\[\[([^\]]+)\]\]|\{\{([^}]+)\}\}/g;
  var html = '';
  var lastIndex = 0;
  var blankIdx = 0;
  var m;
  while ((m = re.exec(text)) !== null){
    html += escapeHtml(text.slice(lastIndex, m.index));
    if (m[1] !== undefined){
      if (clozeMode){
        var key = cardId + '-b' + blankIdx;
        var val = m[1];
        if (revealed.has(key)){
          html += '<span class="fc-blank revealed" data-key="' + key + '">' + escapeHtml(val) + '</span>';
        } else {
          var blankLen = Math.max(3, Math.min(10, Math.round(val.length / 1.6)));
          html += '<span class="fc-blank" data-key="' + key + '">' + new Array(blankLen + 1).join('▁') + '</span>';
        }
        blankIdx++;
      } else {
        html += escapeHtml(m[1]);
      }
    } else if (m[2] !== undefined){
      var term = m[2];
      html += '<span class="fc-term" data-term="' + escapeAttr(term) + '">' + escapeHtml(term) + '</span>';
    }
    lastIndex = re.lastIndex;
  }
  html += escapeHtml(text.slice(lastIndex));
  return html;
}

var storageBackend = null; /* 'artifact' | 'local' | 'none' */
var LS_PREFIX = 'fc-gijutsushi:';

function detectStorageBackend(maxTries, intervalMs){
  return new Promise(function(resolve){
    var tries = 0;
    (function check(){
      if (window.storage){ resolve('artifact'); return; }
      tries++;
      if (tries >= maxTries){
        try {
          var testKey = LS_PREFIX + '__test__';
          localStorage.setItem(testKey, '1');
          localStorage.removeItem(testKey);
          resolve('local');
        } catch (e){ resolve('none'); }
        return;
      }
      setTimeout(check, intervalMs);
    })();
  });
}

function storageGet(key){
  if (storageBackend === 'artifact'){
    return window.storage.get(key, false)
      .then(function(res){ return (res && res.value) ? res.value : null; })
      .catch(function(){ return null; });
  }
  if (storageBackend === 'local'){
    try { return Promise.resolve(localStorage.getItem(LS_PREFIX + key)); }
    catch (e){ return Promise.resolve(null); }
  }
  return Promise.resolve(null);
}
function storageSet(key, value){
  if (storageBackend === 'artifact') return window.storage.set(key, value, false).catch(function(){});
  if (storageBackend === 'local'){
    try { localStorage.setItem(LS_PREFIX + key, value); } catch (e){}
  }
  return Promise.resolve();
}

function loadWeakIds(){
  return storageGet('weak-cards').then(function(v){ return v ? JSON.parse(v) : []; }).catch(function(){ return []; });
}
function saveWeakIds(){ storageSet('weak-cards', JSON.stringify(Array.from(weakSet))); }

function loadProgressFor(subj, mode){
  return storageGet('fc-progress-' + subj + '-' + mode).then(function(v){ return v ? JSON.parse(v) : null; }).catch(function(){ return null; });
}
function loadAllProgress(){
  var keys = [];
  SUBJECTS.forEach(function(s){ ['full', 'cloze'].forEach(function(m){ keys.push({subj: s.id, mode: m}); }); });
  return Promise.all(keys.map(function(k){ return loadProgressFor(k.subj, k.mode); })).then(function(results){
    var map = {};
    keys.forEach(function(k, i){ if (results[i]) map[sessionKey(k.subj, k.mode)] = results[i]; });
    return map;

}

function loadTotals(){

}

function loadRatings(){

function allBackupKeys(){
  var keys = ['weak-cards', 'fc-completions', 'fc-ratings', 'fc-totals', 'fc-last-mode', 'fc-last-subject', 'fc-edits'];
  SUBJECTS.forEach(function(s){ ['full', 'cloze'].forEach(function(m){ keys.push('fc-progress-' + s.id + '-' + m); }); });
  return keys;
}

function exportBackup(){
  var keys = allBackupKeys();
  Promise.all(keys.map(function(k){ return storageGet(k).then(function(v){ return { k: k, v: v }; }); })).then(function(results){
    var data = {};
    results.forEach(function(r){ if (r.v !== null) data[r.k] = r.v; });
    var payload = { version: 1, exportedAt: new Date().toISOString(), data: data };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'gijutsushi-backup-' + todayDateStr() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  });
}

function importBackupFile(file){
  var reader = new FileReader();
  reader.onload = function(){
    var payload;
    try { payload = JSON.parse(reader.result); } catch (e){ payload = null; }
    var data = payload && payload.data ? payload.data : null;
    if (!data){ alert('バックアップファイルの形式が正しくありません。'); return; }
    if (!confirm('現在のデータを、このバックアップの内容で上書きします。よろしいですか？')) return;
    var keys = Object.keys(data);
    Promise.all(keys.map(function(k){ return storageSet(k, data[k]); })).then(function(){
      alert('復元しました。ページを再読み込みします。');
      location.reload();
    });
  };
  reader.readAsText(file);
}

/* ---------- study actions ---------- */

function markVisitedCurrent(){
  var deck = currentDeck();
  if (!state.order.length) return;
  var card = deck.cards[state.order[state.pos]];
  if (!card) return;
  state.visited.add(card.id);

  if (deck.cards.length > 0 && state.visited.size >= deck.cards.length){
    var key = deck.id + ':' + currentMode;
    completions[key] = (completions[key] || 0) + 1;
    saveCompletions();
    state.visited = new Set([card.id]);
  }
}

function rateCurrent(grade){
  var deck = currentDeck();
  if (!state.order.length) return;
  var card = deck.cards[state.order[state.pos]];
  if (!card) return;
  var key = card.id + ':' + currentMode;
  if (!ratings[key]) ratings[key] = { ok: 0, meh: 0, bad: 0 };
  ratings[key][grade]++;
  saveRatings();

  totalReviews++;
  var today = todayDateStr();
  dailyLog[today] = (dailyLog[today] || 0) + 1;
  saveTotals();

  if (deck.id === currentSubject + '-priority'){
    var refreshed = getDeckList(currentSubject)[state.deckIdx];
    var n = refreshed.cards.length;
    var newOrder = []; for (var i = 0; i < n; i++) newOrder.push(i);
    state.order = newOrder;
    var foundIdx = refreshed.cards.findIndex(function(cd){ return cd.id === card.id; });
    state.pos = n > 0 ? (foundIdx >= 0 ? foundIdx : Math.min(state.pos, n - 1)) : 0;
  }

  render();
  var btn = document.querySelector('.fc-rate-btn[data-grade="' + grade + '"]');
  if (btn){
    btn.classList.add('flash');
    setTimeout(function(){ btn.classList.remove('flash'); }, 250);
  }
}

var editingCardId = null;

function openEditPanel(){
  var deck = currentDeck();
  if (!state.order.length) return;
  var card = deck.cards[state.order[state.pos]];
  if (!card) return;
  editingCardId = card.id;
  document.getElementById('fc-edit-front').value = card.front;
  document.getElementById('fc-edit-back').value = card.back;
  document.getElementById('fc-edit-panel').style.display = '';
}

function closeEditPanel(){
  editingCardId = null;
  document.getElementById('fc-edit-panel').style.display = 'none';
}

function findEditingCard(){
  var deck = currentDeck();
  if (!state.order.length) return null;
  var card = deck.cards[state.order[state.pos]];
  if (!card || card.id !== editingCardId) return null;
  return card;
}

function saveCardEdit(){
  var card = findEditingCard();
  if (!card){ closeEditPanel(); return; }
  var newFront = document.getElementById('fc-edit-front').value;
  var newBack = document.getElementById('fc-edit-back').value;
  card.front = newFront;
  card.back = newBack;
  edits[card.id] = { front: newFront, back: newBack };
  saveEdits();
  closeEditPanel();
  render();
}

function revertCardEdit(){
  var card = findEditingCard();
  if (!card){ closeEditPanel(); return; }
  card.front = card.originalFront;
  card.back = card.originalBack;
  delete edits[card.id];
  saveEdits();
  closeEditPanel();
  render();
}

function wrapSelectionAsBlank(){
  var ta = document.getElementById('fc-edit-back');
  var s = ta.selectionStart, e = ta.selectionEnd;
  if (s === e){ alert('空欄にしたい文字をドラッグして選択してから押してください。'); return; }
  var val = ta.value;
  var selected = val.slice(s, e);
  ta.value = val.slice(0, s) + '[[' + selected + ']]' + val.slice(e);
  ta.focus();
  ta.setSelectionRange(s, s + selected.length + 4);
}

function unwrapSelectionBlank(){
  var ta = document.getElementById('fc-edit-back');
  var s = ta.selectionStart, e = ta.selectionEnd;
  var val = ta.value;
  var selected = val.slice(s, e);
  if (selected.length >= 4 && selected.slice(0, 2) === '[[' && selected.slice(-2) === ']]'){
    var inner = selected.slice(2, -2);
    ta.value = val.slice(0, s) + inner + val.slice(e);
    ta.focus();
    ta.setSelectionRange(s, s + inner.length);
  } else {
    alert('選択範囲が [[ ]] で囲まれていません。[[ ]] を含めて選択してください。');
  }
}

function toggleWeakCurrent(){
  var deck = currentDeck();
  if (!state.order.length) return;
  var card = deck.cards[state.order[state.pos]];
  if (!card) return;
  if (weakSet.has(card.id)) weakSet.delete(card.id); else weakSet.add(card.id);
  saveWeakIds();
  if (currentDeck().id === currentSubject + '-weak'){
    var n = buildWeakDeck(currentSubject).cards.length;
    state.order = [];
    for (var i = 0; i < n; i++) state.order.push(i);
    if (state.pos >= n) state.pos = Math.max(0, n - 1);
    flipped = false;
    revealed = new Set();
  }
  render();
  saveProgress();
}

function clearAllWeak(){
  var subjectCardIds = new Set();
  topicDecksFor(currentSubject).forEach(function(d){ d.cards.forEach(function(cd){ subjectCardIds.add(cd.id); }); });
  subjectCardIds.forEach(function(id){ weakSet.delete(id); });
  saveWeakIds();
  if (currentDeck().id === currentSubject + '-weak') { loadDeck(state.deckIdx, true); saveProgress(); }
  else render();
}

function isDark(){
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}

function loadDeck(idx, skipMark){
  if (getDeckList(currentSubject)[idx].id === currentSubject + '-quiz') delete quizCache[currentSubject];
  state.deckIdx = idx;
  var n = currentDeck().cards.length;
  state.order = [];
  for (var i = 0; i < n; i++) state.order.push(i);
  state.pos = 0;
  state.visited = new Set();
  flipped = false;
  revealed = new Set();
  if (!skipMark) markVisitedCurrent();
  render();
}

function shuffleCurrent(){
  if (currentDeck().id === currentSubject + '-quiz') delete quizCache[currentSubject];
  var n = currentDeck().cards.length;
  var ord = []; for (var i = 0; i < n; i++) ord.push(i);
  state.order = shuffleArr(ord);
  state.pos = 0;
  flipped = false;
  revealed = new Set();
  markVisitedCurrent();
  render();
  saveProgress();
}

function go(delta){
  var n = state.order.length;
  if (n === 0) return;
  state.pos = (state.pos + delta + n) % n;
  flipped = false;
  revealed = new Set();
  markVisitedCurrent();
  render();
  saveProgress();
}

function flip(){
  flipped = !flipped;
  document.getElementById('fc-card').classList.toggle('flipped', flipped);
  document.getElementById('fc-flip').textContent = flipped ? '問題に戻す' : '回答を見る';
}

function setMode(m){
  if (currentMode === m) return;
  currentMode = m;
  state = ensureSession(currentSubject, currentMode);
  flipped = false;
  revealed = new Set();
  render();
  saveProgress();
  saveLastMode();
}

function setSubject(subj){
  if (currentSubject === subj) return;
  currentSubject = subj;
  state = ensureSession(currentSubject, currentMode);
  flipped = false;
  revealed = new Set();
  render();
  saveLastSubject();
}

/* ---------- timer ---------- */

var timerSeconds = 120 * 60;
var timerInterval = null;
var timerRunning = false;

function formatTime(s){
  var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimerDisplay(){ document.getElementById('fc-timer-display').textContent = formatTime(timerSeconds); }
function updateTimerButtons(){
  document.getElementById('fc-timer-start').style.display = timerRunning ? 'none' : '';
  document.getElementById('fc-timer-pause').style.display = timerRunning ? '' : 'none';
}
function startTimer(){
  if (timerRunning || timerSeconds <= 0) return;
  timerRunning = true;
  document.getElementById('fc-timer-display').style.color = '';
  timerInterval = setInterval(function(){
    timerSeconds--;
    updateTimerDisplay();
    if (timerSeconds <= 0){
      clearInterval(timerInterval);
      timerRunning = false;
      document.getElementById('fc-timer-display').style.color = '#a6412b';
      updateTimerButtons();
    }
  }, 1000);
  updateTimerButtons();
}
function pauseTimer(){ clearInterval(timerInterval); timerRunning = false; updateTimerButtons(); }
function resetTimer(){
  clearInterval(timerInterval);
  timerRunning = false;
  var mins = parseInt(document.getElementById('fc-timer-minutes').value, 10) || 120;
  timerSeconds = mins * 60;
  document.getElementById('fc-timer-display').style.color = '';
  updateTimerDisplay();
  updateTimerButtons();
}

/* ---------- stats panel ---------- */

function cardTallyFor(cardId, mode){
  return ratings[cardId + ':' + mode] || { ok:0, meh:0, bad:0 };
}

function buildStatsSection(mode){
  var sectionLabel = mode === 'cloze' ? '穴埋めモード' : '全文モード';
  var rows = '';
  var grandOk=0, grandTotal=0, grandRated=0, grandCards=0;
  topicDecksFor(currentSubject).forEach(function(d){
    var ok=0, meh=0, bad=0, rated=0;
    d.cards.forEach(function(cd){
      var t = cardTallyFor(cd.id, mode);
      var sum = t.ok + t.meh + t.bad;
      if (sum > 0) rated++;
      ok += t.ok; meh += t.meh; bad += t.bad;
    });
    var total = ok + meh + bad;
    var pct = total > 0 ? Math.round((ok / total) * 100) : null;
    grandOk += ok; grandTotal += total; grandRated += rated; grandCards += d.cards.length;
    var label = d.title.replace(/\(.*?\)/, '').trim();
    rows += '<div class="fc-stats-row">' +
      '<div class="fc-stats-label">' + escapeHtml(label) + '</div>' +
      '<div class="fc-stats-bar-track"><div class="fc-stats-bar-fill" style="width:' + (pct===null?0:pct) + '%"></div></div>' +
      '<div class="fc-stats-pct">' + (pct===null ? '未評価' : (pct + '% (' + rated + '/' + d.cards.length + ')')) + '</div>' +
      '</div>';
  });
  var grandPct = grandTotal > 0 ? Math.round((grandOk / grandTotal) * 100) : null;
  var summary = '<div class="fc-stats-row" style="font-weight:600;">' +
    '<div class="fc-stats-label">全体</div>' +
    '<div class="fc-stats-bar-track"><div class="fc-stats-bar-fill" style="width:' + (grandPct===null?0:grandPct) + '%"></div></div>' +
    '<div class="fc-stats-pct">' + (grandPct===null ? '未評価' : (grandPct + '% (' + grandRated + '/' + grandCards + ')')) + '</div>' +
    '</div>';
  return '<div class="fc-stats-section-title">' + sectionLabel + '</div>' + summary + rows;
}

function renderStats(){
  var content = document.getElementById('fc-stats-content');
  content.innerHTML = buildStatsSection('full') + '<div class="fc-stats-divider"></div>' + buildStatsSection('cloze');
}

/* ---------- calendar panel ---------- */

var calendarMonth = new Date();

function renderCalendar(){
  var year = calendarMonth.getFullYear(), month = calendarMonth.getMonth();
  document.getElementById('fc-cal-title').textContent = year + '年' + (month + 1) + '月';
  var firstDay = new Date(year, month, 1);
  var startWeekday = firstDay.getDay();
  var daysInMonth = new Date(year, month + 1, 0).getDate();
  var weekdayLabels = ['日','月','火','水','木','金','土'];
  var html = '';
  weekdayLabels.forEach(function(w){ html += '<div class="fc-cal-weekday">' + w + '</div>'; });
  for (var i = 0; i < startWeekday; i++) html += '<div class="fc-cal-cell fc-cal-empty"></div>';
  var monthTotal = 0;
  var todayStr = todayDateStr();
  for (var d = 1; d <= daysInMonth; d++){
    var dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    var count = dailyLog[dateStr] || 0;
    monthTotal += count;
    var level = count === 0 ? 0 : count < 3 ? 1 : count < 6 ? 2 : count < 10 ? 3 : 4;
    var isToday = dateStr === todayStr;
    html += '<div class="fc-cal-cell fc-cal-level-' + level + (isToday ? ' fc-cal-today' : '') + '" title="' + dateStr + ': ' + count + '枚">' +
      '<div class="fc-cal-daynum">' + d + '</div>' +
      (count > 0 ? '<div class="fc-cal-count">' + count + '</div>' : '') +
      '</div>';
  }
  document.getElementById('fc-cal-grid').innerHTML = html;
  document.getElementById('fc-cal-month-total').textContent = '今月の合計: ' + monthTotal + '枚';
}

/* ---------- render ---------- */

function updateSubjectBar(){
  document.querySelectorAll('.fc-subject-btn').forEach(function(btn){
    var sid = btn.getAttribute('data-subject');
    var def = SUBJECTS.find(function(s){ return s.id === sid; });
    var hasContent = topicDecksFor(sid).length > 0;
    btn.textContent = def.label + (hasContent ? '' : '(準備中)');
    btn.classList.toggle('active', sid === currentSubject);
    btn.classList.toggle('fc-subject-empty', !hasContent);
  });
}

function render(){
  updateSubjectBar();

  var hasContent = topicDecksFor(currentSubject).length > 0;
  document.getElementById('fc-study-area').style.display = hasContent ? '' : 'none';
  document.getElementById('fc-empty-subject').style.display = hasContent ? 'none' : '';
  if (!hasContent) return;

  var modeFullBtn = document.getElementById('fc-mode-full');
  var modeClozeBtn = document.getElementById('fc-mode-cloze');
  modeFullBtn.classList.toggle('active', currentMode === 'full');
  modeClozeBtn.classList.toggle('active', currentMode === 'cloze');

  var thisDeckList = getDeckList(currentSubject);

  var rec = todayRecommendedDeck(currentSubject);
  var banner = document.getElementById('fc-today-banner');
  if (rec && thisDeckList[state.deckIdx] && thisDeckList[state.deckIdx].id !== rec.deck.id){
    document.getElementById('fc-today-banner-text').textContent =
      '📌 今日(' + rec.weekdayLabel + ')のおすすめ: ' + rec.deck.title.replace(/\(全\d+枚\)|\(\d+\)/, '');
    document.getElementById('fc-today-banner-btn').onclick = function(){ loadDeck(rec.listIndex); saveProgress(); };

  } else {
    banner.style.display = 'none';
  }

  var deckPickerLabel = document.getElementById('fc-deck-picker-label');
  var deckPickerList = document.getElementById('fc-deck-picker-list');

  deckPickerList.innerHTML = '';
  thisDeckList.forEach(function(d, i){
    var btn = document.createElement('button');
    btn.className = 'fc-deck-pick-btn' + (i === state.deckIdx ? ' active' : '');
    btn.textContent = d.title.replace(/\(全\d+枚\)/, '');
    btn.addEventListener('click', function(){ loadDeck(i); saveProgress(); closeDeckPicker(); });
    deckPickerList.appendChild(btn);
  });

  var deck = currentDeck();
  var total = state.order.length;
  var card = total > 0 ? deck.cards[state.order[state.pos]] : null;
  if (editingCardId && (!card || card.id !== editingCardId)) closeEditPanel();

  var statusEl = document.getElementById('fc-status');
  var subLine = deck.sub ? (' ・ ' + deck.sub) : '';
  statusEl.innerHTML =
    '<span class="fc-deck-title">' + deck.title + subLine + '</span>' +
    '<span>' + (total > 0 ? (state.pos + 1) + ' / ' + total : '0 / 0') + '</span>';

  var track = document.getElementById('fc-progress-track') || (function(){
    var t = document.createElement('div');
    t.id = 'fc-progress-track';
    t.innerHTML = '<div id="fc-progress-bar"></div>';
    statusEl.insertAdjacentElement('afterend', t);
    return t;
  })();
  var bar = document.getElementById('fc-progress-bar');
  bar.style.width = total > 0 ? Math.round(((state.pos + 1) / total) * 100) + '%' : '0%';

  var lapKey = deck.id + ':' + currentMode;
  var lapCount = completions[lapKey] || 0;
  var modeLabel = currentMode === 'cloze' ? '穴埋め' : '全文';
  var todayDisplay = dailyLog[todayDateStr()] || 0;
  document.getElementById('fc-stats-line').innerHTML =
    '<span>この項目(' + modeLabel + '): ' + lapCount + '周完了</span>' +
    '<span>今日 ' + todayDisplay + '枚 ／ 累計 ' + totalReviews + '枚</span>';

  var front = document.getElementById('fc-face-front');
  var back = document.getElementById('fc-face-back');
  var cardEl = document.getElementById('fc-card');
  cardEl.classList.toggle('flipped', flipped);
  document.getElementById('fc-flip').textContent = flipped ? '問題に戻す' : '回答を見る';

  var markBtn = document.getElementById('fc-mark');
  var explainBtn = document.getElementById('fc-explain-btn');
  if (!card){
    front.innerHTML = '<div class="fc-front-title">カードがありません</div>';
    back.innerHTML = '';
    markBtn.style.display = 'none';
    explainBtn.style.display = 'none';
    return;
  }
  markBtn.style.display = '';
  var isWeak = weakSet.has(card.id);
  markBtn.textContent = isWeak ? '★ 苦手' : '☆ 苦手';
  markBtn.classList.toggle('active', isWeak);
  explainBtn.style.display = card.explain ? '' : 'none';

  var meta = CATS[card.cat];
  var dark = isDark();
  var pillBg = dark ? meta.bgDark : meta.bg;
  var pillFg = dark ? meta.fgDark : meta.fg;
  var pillStyle = 'background:' + pillBg + ';color:' + pillFg + ';';

  var tally = cardTallyFor(card.id, currentMode);
  var tallyTotal = tally.ok + tally.meh + tally.bad;
  var accuracyHtml = '<div class="fc-card-accuracy">' +
    (tallyTotal > 0 ? '正答率: ' + Math.round((tally.ok / tallyTotal) * 100) + '% (' + tallyTotal + '回評価)' : 'まだ評価なし') +
    (edits[card.id] ? ' ・ ✏️編集済み' : '') +
    '</div>';

  front.innerHTML = currentMode === 'cloze'
    ? '<span class="fc-pill" style="' + pillStyle + '">' + meta.label + '</span>' + accuracyHtml +
      '<div class="fc-cloze-heading">' + renderCardText(card.front.split('\n')[0], card.id, false) + '</div>' +
      '<div class="fc-back-text">' + renderCardText(card.back, card.id, true) + '</div>' +
      '<div class="fc-front-sub">空欄をタップして単語を確認 / 「回答を見る」で全文表示</div>'
    : '<span class="fc-pill" style="' + pillStyle + '">' + meta.label + '</span>' + accuracyHtml +
      '<div class="fc-front-title">' + renderCardText(card.front, card.id, false) + '</div>' +
      '<div class="fc-front-sub">下の「回答を見る」ボタンで確認</div>';

  back.innerHTML =
    '<span class="fc-pill" style="' + pillStyle + '">' + meta.label + '</span>' + accuracyHtml +
    '<div class="fc-back-text">' + renderCardText(card.back, card.id, false) + '</div>' +
    (card.note ? '<div class="fc-back-note">' + escapeHtml(card.note) + '</div>' : '');

  if (document.getElementById('fc-stats-panel').style.display !== 'none') renderStats();
}

function escapeHtml(s){
  var div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML.replace(/\n/g, '<br>');
}

function enableHorizontalScroll(el){
  if (!el) return;
  el.addEventListener('wheel', function(e){
    if (el.scrollWidth <= el.clientWidth) return;
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)){
      el.scrollLeft += e.deltaY;
      e.preventDefault();
    }
  }, {passive:false});
  var isDown = false, startX = 0, startScroll = 0, moved = false;
  el.addEventListener('mousedown', function(e){
    isDown = true; moved = false;
    startX = e.pageX; startScroll = el.scrollLeft;
    el.classList.add('fc-dragging');
  });
  window.addEventListener('mousemove', function(e){
    if (!isDown) return;
    var dx = e.pageX - startX;
    if (Math.abs(dx) > 4) moved = true;
    el.scrollLeft = startScroll - dx;
  });
  window.addEventListener('mouseup', function(){
    if (isDown) setTimeout(function(){ isDown = false; }, 0);
    el.classList.remove('fc-dragging');
  });
  el.addEventListener('click', function(e){
    if (moved){ e.stopPropagation(); e.preventDefault(); moved = false; }
  }, true);
}

detectStorageBackend(6, 50).then(function(backend){
  storageBackend = backend;
  return Promise.all([loadWeakIds(), loadAllProgress(), loadCompletions(), loadTotals(), loadRatings(), loadLastMode(), loadLastSubject(), loadEdits()]);
}).then(function(results){
  var ids = results[0], progMap = results[1], comp = results[2], totals = results[3],
      rat = results[4], lastMode = results[5], lastSubject = results[6], savedEdits = results[7];

  weakSet = new Set(ids);
  completions = comp || {};
  ratings = rat || {};
  if (totals){
    totalReviews = typeof totals.total === 'number' ? totals.total : 0;
    dailyLog = totals.daily || {};
  }
  edits = savedEdits || {};
  decks.forEach(function(d){
    d.cards.forEach(function(card){
      var e = edits[card.id];
      if (e){
        if (e.front !== undefined) card.front = e.front;
        if (e.back !== undefined) card.back = e.back;
      }
    });
  });
  savedProgressMap = progMap || {};
  sessions = {};

  currentSubject = (lastSubject && SUBJECTS.some(function(s){ return s.id === lastSubject; })) ? lastSubject : 'hisu1';
  currentMode = (lastMode === 'cloze') ? 'cloze' : 'full';
  state = ensureSession(currentSubject, currentMode);
  flipped = false;
  revealed = new Set();
  render();
});
})();
