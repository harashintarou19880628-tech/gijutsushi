<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>技術士第二次試験 フラッシュカード</title>
</head>
<body>
<div id="fc-root">
<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;">技術士第二次試験 答案復習用フラッシュカード。科目・デッキを選び、カードをクリックすると表(概念)と裏(詳細)が切り替わります。</h2>

<div id="fc-timer-bar">
  <span id="fc-timer-display">02:00:00</span>
  <input type="number" id="fc-timer-minutes" min="1" max="300" value="120" aria-label="タイマー分数">
  <button id="fc-timer-start">試験タイマー開始</button>
  <button id="fc-timer-pause" style="display:none;">一時停止</button>
  <button id="fc-timer-reset">リセット</button>
</div>

<div id="fc-subject-bar">
  <button class="fc-subject-btn" data-subject="hisu1">必須Ⅰ</button>
  <button class="fc-subject-btn" data-subject="sentaku2-1">選択Ⅱ-1</button>
  <button class="fc-subject-btn" data-subject="sentaku2-2">選択Ⅱ-2</button>
  <button class="fc-subject-btn" data-subject="sentaku3">選択Ⅲ</button>
  <button class="fc-subject-btn" data-subject="kyotsu">共通チェック</button>
</div>

<div id="fc-empty-subject" style="display:none;">
  <div class="fc-empty-msg">この科目のカードはまだ準備中です。追加され次第ここに表示されます。</div>
</div>

<div id="fc-study-area">
  <div id="fc-mode-bar">
    <button id="fc-mode-full" class="fc-mode-btn">全文モード</button>
    <button id="fc-mode-cloze" class="fc-mode-btn">穴埋めモード</button>
  </div>
  <div id="fc-today-banner" style="display:none;">
    <span id="fc-today-banner-text"></span>
    <button id="fc-today-banner-btn">開く</button>
  </div>
  <div id="fc-deck-bar"></div>
  <div id="fc-status"></div>
  <div id="fc-stats-line"></div>
  <div id="fc-card-wrap">
    <button id="fc-mark" aria-label="このカードを苦手としてマーク">☆ 苦手</button>
    <div id="fc-card">
      <div id="fc-card-inner">
        <div id="fc-face-front" class="fc-face"></div>
        <div id="fc-face-back" class="fc-face fc-face-back"></div>
      </div>
    </div>
  </div>
  <div id="fc-rate-bar">
    <button class="fc-rate-btn fc-rate-bad" data-grade="bad">✕ できなかった</button>
    <button class="fc-rate-btn fc-rate-meh" data-grade="meh">△ 怪しい</button>
    <button class="fc-rate-btn fc-rate-ok" data-grade="ok">○ できた</button>
  </div>
  <div id="fc-nav">
    <button id="fc-prev" aria-label="前のカード">‹ 前</button>
    <button id="fc-flip">回答を見る</button>
    <button id="fc-next" aria-label="次のカード">次 ›</button>
  </div>
  <div id="fc-tools">
    <button id="fc-shuffle">シャッフル</button>
    <button id="fc-clear-weak">苦手マークを解除</button>
    <button id="fc-edit-toggle">✏️ 編集</button>
    <button id="fc-stats-toggle">📊 成績</button>
    <button id="fc-cal-toggle">📅 カレンダー</button>
    <button id="fc-backup-export">💾 バックアップ</button>
    <button id="fc-backup-import-btn">📂 復元</button>
    <input type="file" id="fc-backup-import-input" accept="application/json,.json" style="display:none;">
    <span id="fc-hint">クリック / Spaceキーで裏返し、←→キーで移動</span>
  </div>
  <div id="fc-edit-panel" style="display:none;">
    <div id="fc-edit-title">このカードを編集</div>
    <label class="fc-edit-label" for="fc-edit-front">表(問題文)</label>
    <textarea id="fc-edit-front" rows="3"></textarea>
    <label class="fc-edit-label" for="fc-edit-back">裏(回答文) ― [[ ]]で囲んだ部分が穴埋め対象になります</label>
    <textarea id="fc-edit-back" rows="7"></textarea>
    <div id="fc-edit-blank-tools">
      <button id="fc-edit-wrap">選択範囲を空欄にする</button>
      <button id="fc-edit-unwrap">空欄を解除</button>
    </div>
    <div id="fc-edit-actions">
      <button id="fc-edit-save">保存</button>
      <button id="fc-edit-revert">元の文章に戻す</button>
      <button id="fc-edit-cancel">キャンセル</button>
    </div>
  </div>
  <div id="fc-stats-panel" style="display:none;">
    <div id="fc-stats-title">項目別の正答率(モード別)</div>
    <div id="fc-stats-content"></div>
    <button id="fc-stats-close">閉じる</button>
  </div>
  <div id="fc-cal-panel" style="display:none;">
    <div id="fc-cal-header">
      <button id="fc-cal-prev">‹</button>
      <div id="fc-cal-title"></div>
      <button id="fc-cal-next">›</button>
    </div>
    <div id="fc-cal-grid"></div>
    <div id="fc-cal-month-total"></div>
    <button id="fc-cal-close">閉じる</button>
  </div>
</div>
</div>

<div id="fc-glossary-overlay" style="display:none;">
  <div id="fc-glossary-modal">
    <button id="fc-glossary-close" aria-label="閉じる">✕</button>
    <div id="fc-glossary-title"></div>
    <div id="fc-glossary-svg"></div>
    <div id="fc-glossary-body"></div>
  </div>
</div>

<style>
body{margin:0;padding:1rem;background:#F7F5EF;}
#fc-root{font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#2B2B26;max-width:640px;margin:0 auto;padding:0.5rem 0 1rem;}

#fc-timer-bar{display:flex;align-items:center;gap:6px;margin-bottom:10px;padding:8px 10px;border:0.5px solid #D8D4C6;border-radius:10px;background:#FFFFFF;flex-wrap:wrap;}
#fc-timer-display{font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;color:#2B2B26;min-width:78px;}
#fc-timer-minutes{width:52px;font-size:12px;padding:5px;border-radius:6px;border:0.5px solid #D8D4C6;}
#fc-timer-bar button{font-size:12px;padding:6px 10px;border-radius:8px;border:0.5px solid #D8D4C6;background:#F7F5EF;color:#2B2B26;cursor:pointer;}
#fc-timer-start{background:#2F5D50 !important;color:#FFFFFF !important;border-color:#2F5D50 !important;}

#fc-subject-bar{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
#fc-subject-bar::-webkit-scrollbar{height:4px;}
.fc-subject-btn{flex:0 0 auto;border:0.5px solid #D8D4C6;background:#FFFFFF;color:#5B5A50;font-size:12px;padding:9px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;}
.fc-subject-btn.active{background:#2F5D50;border-color:#2F5D50;color:#FFFFFF;font-weight:500;}
.fc-subject-btn.fc-subject-empty{color:#B0AEA0;}
.fc-subject-btn.fc-subject-empty.active{background:#8a8879;border-color:#8a8879;}

#fc-empty-subject{border:0.5px dashed #D8D4C6;border-radius:12px;padding:32px 16px;text-align:center;}
.fc-empty-msg{color:#8a8879;font-size:13px;line-height:1.7;}

#fc-deck-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px;-webkit-overflow-scrolling:touch;}
#fc-deck-bar::-webkit-scrollbar{height:4px;}
.fc-deck-btn{flex:0 0 auto;border:0.5px solid #D8D4C6;background:#FFFFFF;color:#5B5A50;font-size:13px;padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;}
.fc-deck-btn.active{background:#2F5D50;border-color:#2F5D50;color:#FFFFFF;}
#fc-mode-bar{display:flex;gap:6px;margin-bottom:10px;}
#fc-today-banner{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#E3F1E8;border:0.5px solid #B9DFC7;border-radius:10px;padding:9px 12px;margin-bottom:10px;font-size:12.5px;color:#245a3f;}
#fc-today-banner button{flex:0 0 auto;font-size:12px;padding:6px 12px;border-radius:8px;border:0.5px solid #2F5D50;background:#2F5D50;color:#FFFFFF;cursor:pointer;}
.fc-mode-btn{flex:1;border:0.5px solid #D8D4C6;background:#FFFFFF;color:#5B5A50;font-size:13px;padding:8px 0;border-radius:8px;cursor:pointer;}
.fc-mode-btn.active{background:#EDE9F7;border-color:#B9ADE0;color:#4a3a78;font-weight:500;}
#fc-status{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:#7A7868;margin:2px 2px 10px;}
#fc-status .fc-deck-title{font-size:14px;color:#2B2B26;font-weight:500;}
#fc-progress-track{background:#EAE7DB;border-radius:4px;height:4px;overflow:hidden;margin:0 2px 6px;}
#fc-progress-bar{background:#2F5D50;height:100%;width:0%;transition:width .2s ease;}
#fc-stats-line{font-size:12px;color:#8a8879;margin:0 2px 14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;}

#fc-card-wrap{perspective:1400px;margin-bottom:12px;position:relative;}
#fc-mark{position:absolute;top:10px;right:10px;z-index:5;font-size:12px;padding:6px 11px;border-radius:999px;border:0.5px solid #D8D4C6;background:#FFFFFF;color:#8a8879;cursor:pointer;}
#fc-mark.active{background:#FCEFD8;border-color:#EACB8A;color:#8a5a12;}
#fc-card{position:relative;height:min(58vh, 440px);min-height:220px;outline:none;}
#fc-card:focus-visible #fc-card-inner{box-shadow:0 0 0 2px #2F5D50;}
#fc-card-inner{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
#fc-card.flipped #fc-card-inner{transform:rotateY(180deg);}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;background:#FFFFFF;border:0.5px solid #E1DDCF;border-radius:14px;padding:26px 24px;display:flex;flex-direction:column;box-sizing:border-box;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.fc-face-back{transform:rotateY(180deg);}
.fc-pill{align-self:flex-start;font-size:12px;padding:4px 10px;border-radius:999px;font-weight:500;margin-bottom:8px;}
.fc-card-accuracy{font-size:11px;color:#8a8879;margin-bottom:10px;}
.fc-front-title{font-size:19px;font-weight:500;line-height:1.55;}
.fc-cloze-heading{font-size:13px;color:#8a8879;font-weight:500;margin-bottom:12px;}
.fc-front-sub{font-size:13px;color:#8a8879;margin-top:10px;}
.fc-back-text{font-size:15px;line-height:1.85;color:#2B2B26;white-space:pre-line;}
.fc-back-note{font-size:12px;color:#8a8879;margin-top:14px;border-top:0.5px solid #EAE7DB;padding-top:10px;}
.fc-blank{display:inline-block;background:#EDE9F7;color:#4a3a78;border:none;border-bottom:2px dashed #B9ADE0;border-radius:4px;padding:0 6px;margin:0 1px;font:inherit;line-height:1.6;cursor:pointer;}
.fc-blank.revealed{background:#FCEFD8;color:#8a5a12;border-bottom:2px solid transparent;cursor:pointer;}

#fc-rate-bar{display:flex;gap:8px;margin-bottom:10px;}
.fc-rate-btn{flex:1;font-size:13px;padding:9px 0;border-radius:8px;border:0.5px solid #D8D4C6;background:#FFFFFF;color:#5B5A50;cursor:pointer;}
.fc-rate-btn:active{transform:scale(0.98);}
.fc-rate-bad{color:#8a3620;}
.fc-rate-meh{color:#8a5a12;}
.fc-rate-ok{color:#245a3f;}
.fc-rate-btn.flash{outline:2px solid currentColor;}

#fc-nav{display:flex;gap:8px;margin-bottom:10px;}
#fc-nav button{flex:1;font-size:14px;padding:10px 0;border-radius:8px;border:0.5px solid #D8D4C6;background:#FFFFFF;color:#2B2B26;cursor:pointer;}
#fc-nav button:active{transform:scale(0.98);}
#fc-flip{background:#2F5D50 !important;color:#FFFFFF !important;border-color:#2F5D50 !important;}
#fc-tools{display:flex;align-items:center;gap:10px;font-size:12px;color:#8a8879;flex-wrap:wrap;margin-bottom:10px;}
#fc-tools button{font-size:12px;padding:6px 12px;border-radius:8px;border:0.5px solid #D8D4C6;background:#FFFFFF;color:#5B5A50;cursor:pointer;}

#fc-stats-panel, #fc-cal-panel, #fc-edit-panel{border:0.5px solid #D8D4C6;border-radius:12px;padding:14px;background:#FFFFFF;margin-bottom:10px;}
#fc-edit-title{font-size:14px;font-weight:600;margin-bottom:10px;}
.fc-edit-label{display:block;font-size:11.5px;color:#8a8879;margin:10px 0 5px;}
#fc-edit-front, #fc-edit-back{width:100%;box-sizing:border-box;font-family:inherit;font-size:14px;line-height:1.6;padding:10px;border-radius:8px;border:0.5px solid #D8D4C6;background:#FAF9F5;color:#2B2B26;resize:vertical;}
#fc-edit-blank-tools{display:flex;gap:8px;margin-top:8px;}
#fc-edit-actions{display:flex;gap:8px;margin-top:14px;}
#fc-edit-blank-tools button, #fc-edit-actions button{flex:1;font-size:12.5px;padding:9px 0;border-radius:8px;border:0.5px solid #D8D4C6;background:#F7F5EF;color:#2B2B26;cursor:pointer;}
#fc-edit-save{background:#2F5D50 !important;color:#FFFFFF !important;border-color:#2F5D50 !important;}

.fc-term{display:inline;color:#204a78;border-bottom:1.5px dotted #204a78;cursor:pointer;font:inherit;}

#fc-glossary-overlay{position:fixed;inset:0;background:rgba(20,20,16,0.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:200;}
#fc-glossary-modal{position:relative;background:#FFFFFF;border-radius:14px;padding:20px;max-width:480px;width:100%;max-height:82vh;overflow-y:auto;box-sizing:border-box;}
#fc-glossary-close{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:999px;border:0.5px solid #D8D4C6;background:#F7F5EF;color:#5B5A50;font-size:14px;cursor:pointer;}
#fc-glossary-title{font-size:16px;font-weight:600;color:#2B2B26;margin:0 34px 12px 0;}
#fc-glossary-svg{margin-bottom:14px;border-radius:10px;overflow:hidden;}
#fc-glossary-svg svg{width:100%;height:auto;display:block;}
#fc-glossary-body{font-size:14px;line-height:1.8;color:#2B2B26;}
#fc-glossary-body p{margin:0 0 10px;}
#fc-glossary-body ul{margin:0 0 10px;padding-left:20px;}
#fc-glossary-body li{margin-bottom:6px;}
.fc-glossary-section-title{font-size:12px;font-weight:600;color:#2F5D50;margin:14px 0 6px;}
#fc-stats-title{font-size:14px;font-weight:600;margin-bottom:10px;}
.fc-stats-section-title{font-size:12px;font-weight:600;color:#2F5D50;margin:4px 0 8px;}
.fc-stats-divider{height:0.5px;background:#EAE7DB;margin:14px 0;}
.fc-stats-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;}
.fc-stats-label{width:96px;flex:0 0 96px;color:#5B5A50;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fc-stats-bar-track{flex:1;background:#EAE7DB;border-radius:4px;height:10px;overflow:hidden;}
.fc-stats-bar-fill{background:#2F5D50;height:100%;}
.fc-stats-pct{width:80px;flex:0 0 80px;text-align:right;color:#7A7868;}
#fc-stats-close, #fc-cal-close{margin-top:6px;font-size:12px;padding:6px 12px;border-radius:8px;border:0.5px solid #D8D4C6;background:#F7F5EF;color:#5B5A50;cursor:pointer;}

#fc-cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
#fc-cal-title{font-size:14px;font-weight:600;}
#fc-cal-header button{font-size:14px;padding:4px 12px;border-radius:8px;border:0.5px solid #D8D4C6;background:#F7F5EF;color:#2B2B26;cursor:pointer;}
#fc-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.fc-cal-weekday{font-size:10px;color:#8a8879;text-align:center;padding:2px 0 6px;}
.fc-cal-cell{aspect-ratio:1;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;}
.fc-cal-empty{visibility:hidden;}
.fc-cal-level-0{background:#EAE7DB;color:#8a8879;}
.fc-cal-level-1{background:#c9e4d8;color:#1f4a38;}
.fc-cal-level-2{background:#8fc7ab;color:#12291f;}
.fc-cal-level-3{background:#4d9a76;color:#ffffff;}
.fc-cal-level-4{background:#2F5D50;color:#ffffff;}
.fc-cal-today{outline:2px solid #2F5D50;outline-offset:1px;}
.fc-cal-daynum{font-weight:600;line-height:1.1;}
.fc-cal-count{font-size:8.5px;line-height:1.1;}
#fc-cal-month-total{font-size:12px;color:#8a8879;margin-top:10px;}

@media (prefers-color-scheme: dark){
  body{background:#151512;}
  #fc-root{color:#EDEBE2;}
  #fc-timer-bar{background:#1E1E1A;border-color:#3A3A34;}
  #fc-timer-display{color:#EDEBE2;}
  #fc-timer-minutes{background:#242420;border-color:#3A3A34;color:#EDEBE2;}
  #fc-timer-bar button{background:#242420;border-color:#3A3A34;color:#EDEBE2;}
  .fc-subject-btn{background:#242420;border-color:#3A3A34;color:#B8B6A9;}
  .fc-subject-btn.active{background:#4C8A76;border-color:#4C8A76;color:#0E1210;}
  .fc-subject-btn.fc-subject-empty{color:#6E6C60;}
  .fc-subject-btn.fc-subject-empty.active{background:#3A3A34;border-color:#3A3A34;color:#B8B6A9;}
  #fc-empty-subject{border-color:#3A3A34;}
  .fc-empty-msg{color:#8f8d7f;}
  .fc-deck-btn{background:#242420;border-color:#3A3A34;color:#B8B6A9;}
  .fc-deck-btn.active{background:#4C8A76;border-color:#4C8A76;color:#0E1210;}
  .fc-mode-btn{background:#242420;border-color:#3A3A34;color:#B8B6A9;}
  .fc-mode-btn.active{background:#2a2338;border-color:#4a3a78;color:#c3b3ee;}
  #fc-today-banner{background:#16281f;border-color:#245a3f;color:#8fd6ac;}
  #fc-today-banner button{background:#4C8A76;border-color:#4C8A76;color:#0E1210;}
  #fc-status{color:#A6A497;}
  #fc-status .fc-deck-title{color:#EDEBE2;}
  #fc-stats-line{color:#8f8d7f;}
  #fc-progress-track{background:#2C2C27;}
  #fc-progress-bar{background:#4C8A76;}
  .fc-face{background:#1E1E1A;border-color:#3A3A34;}
  .fc-front-sub{color:#8f8d7f;}
  .fc-card-accuracy{color:#8f8d7f;}
  .fc-cloze-heading{color:#8f8d7f;}
  .fc-back-text{color:#EDEBE2;}
  .fc-back-note{color:#8f8d7f;border-top-color:#2C2C27;}
  .fc-blank{background:#2a2338;color:#c3b3ee;border-bottom-color:#4a3a78;}
  .fc-blank.revealed{background:#3a2c10;color:#f0c778;}
  .fc-rate-btn{background:#242420;border-color:#3A3A34;}
  .fc-rate-bad{color:#f0a48c;}
  .fc-rate-meh{color:#f0c778;}
  .fc-rate-ok{color:#8fd6ac;}
  #fc-nav button{background:#242420;border-color:#3A3A34;color:#EDEBE2;}
  #fc-tools button{background:#242420;border-color:#3A3A34;color:#B8B6A9;}
  #fc-mark{background:#242420;border-color:#3A3A34;color:#B8B6A9;}
  #fc-mark.active{background:#3a2c10;border-color:#6a5322;color:#f0c778;}
  #fc-stats-panel, #fc-cal-panel, #fc-edit-panel{background:#1E1E1A;border-color:#3A3A34;}
  .fc-edit-label{color:#8f8d7f;}
  #fc-edit-front, #fc-edit-back{background:#151512;border-color:#3A3A34;color:#EDEBE2;}
  #fc-edit-blank-tools button, #fc-edit-actions button{background:#242420;border-color:#3A3A34;color:#EDEBE2;}
  #fc-edit-save{background:#4C8A76 !important;color:#0E1210 !important;border-color:#4C8A76 !important;}
  .fc-term{color:#9dc2ec;border-bottom-color:#9dc2ec;}
  #fc-glossary-modal{background:#1E1E1A;}
  #fc-glossary-close{background:#242420;border-color:#3A3A34;color:#B8B6A9;}
  #fc-glossary-title{color:#EDEBE2;}
  #fc-glossary-body{color:#EDEBE2;}
  .fc-glossary-section-title{color:#4C8A76;}
  .fc-stats-label{color:#B8B6A9;}
  .fc-stats-bar-track{background:#2C2C27;}
  .fc-stats-bar-fill{background:#4C8A76;}
  .fc-stats-pct{color:#8f8d7f;}
  #fc-stats-close, #fc-cal-close{background:#242420;border-color:#3A3A34;color:#B8B6A9;}
  .fc-stats-section-title{color:#4C8A76;}
  .fc-stats-divider{background:#2C2C27;}
  #fc-cal-header button{background:#242420;border-color:#3A3A34;color:#EDEBE2;}
  .fc-cal-weekday{color:#8f8d7f;}
  .fc-cal-level-0{background:#2C2C27;color:#8f8d7f;}
  .fc-cal-level-1{background:#1c3a2c;color:#9ecdb3;}
  .fc-cal-level-2{background:#245c41;color:#d6f0e2;}
  .fc-cal-level-3{background:#357a58;color:#ffffff;}

    c('youken','技術者倫理の観点は？',

    c('youken','社会の持続可能性の観点は？',

      '地域計画と連携し、[[湛水深]]や地下水位の実測と[[営農意向]]から畑地化の[[適否]]を判定し、[[畑地化区域]]と輪換を行う[[汎用化区域]]を区分して団地化する。[[輪換周期]]は[[土壌診断結果]]に基づき設定する。大型機械の[[作業体系]]を組み、担い手が減少しても転換後の作付面積を維持する。'),
    c('risk','技術的リスクと対策は？',
      '畑作が連続する区域では[[土壌の乾燥化]]や[[有機物の分解]]が進み、[[土壌物理性]]の悪化や地力低下、[[連作障害]]が生じるリスクがある。対策は汎用化区域は土壌診断結果に基づき[[水張り期間]]を設定し[[還元作用]]により地力低下を防ぎ、畑地化区域は[[緑肥作物]]の導入と[[堆肥投入]]により地力を維持する。'),
    c('risk','社会的リスクと対策は？',
      '同一地域内に水稲と畑作が混在することで[[用水の配分]]や地下水位の管理を巡る[[利害対立]]が生じるリスクがある。対策は区域ごとの必要水量と[[管理水位]]を数値化して共有し、土地改良区が中心となり[[水利用ルール]]を協定化して少数の[[水稲経営]]も排除しない合意形成を図る。'),
    c('youken','技術者倫理の観点は？',
      '畑地化は水田の[[一時貯留機能]]を失わせ下流の[[湛水リスク]]を高める。公衆の安全を最優先し[[転換面積]]に応じた[[排水計画]]を照査して第三者への影響を予見する。また畑地化区域は[[原状復帰]]の費用が大きいため輪換を残す汎用化区域と区分し、根拠と責任範囲を示して合意を得る。'),
    c('youken','社会の持続可能性の観点は？',
      '[[用水需要]]の減少は残る[[受益者]]の[[賦課金負担]]を高め、制御システムの維持費も営農者に及ぶ。負担額を試算して地域が支え続けられる[[整備水準]]を選ぶ。[[地下水涵養]]と[[水生生物の生息環境]]にも配慮し、需要の変化に応え続けられる農地を次世代へ継承する。'),
    c('mensetsu','畑地化と汎用化のどちらを優先すべきですか。線引きの考え方を教えてください。',
      '地下水位の実測と営農意向から判定し、恒常的に排水条件が良く畑作の継続が見込める区域は畑地化、水稲との調整が必要な区域は輪換を残す汎用化区域とする。原状復帰の費用が大きい畑地化は対象を絞り込み、可逆性を残す汎用化を基本とする方針である。'),
    c('mensetsu','実需者が求める品質・数量を本当に安定供給できる根拠は何ですか。',
      '地下水位制御と暗渠・パイプライン化で湿害を抑え単収の年次変動を縮小することに加え、輪換周期を土壌診断結果に基づき設定することで地力を維持し、単収そのものを底上げする。両輪で変動要因を減らすことがロットの安定供給につながる。')
  ])},
  {id:'hisu1-d05', subject:'hisu1', title:'05 条件不利地域営農状況の改善', sub:'最重要課題: 集落機能に対応した保全管理体制の再構築', cards: docCards([
    c('saijuyo','なぜ「集落機能に対応した保全管理体制の再構築」が最重要課題か？',
      '①で整備した施設も③で定めた土地利用も日常の管理を担う主体がなければ機能を失う。②は他の2課題の[[実行主体]]そのものであり、その解決は用排水機能の継続を通じて[[食料生産]]を支えると同時に集落に[[共同の場]]を残し農村振興に資する。[[管理の全面委託]]も比較したが、末端の[[日常監視]]は地域の居住を前提とするため採らない。'),
    c('kaiketsu','解決策① {{水土里ビジョン}}による管理体制の構築とは？',
      '[[改正土地改良法]]に基づき、土地改良区が市町村、集落、非農家と[[協議会]]を組織し{{連携管理保全計画}}を策定する。[[必要管理水準]]を[[通水断面]]と[[除草回数]]で数値化して共有し、人員、設備、費用の[[役割分担]]を協定化する。管理の主体と水準を明確にし、用排水機能を確保する。'),
    c('kaiketsu','解決策② 末端施設の改良による管理作業の省力化とは？',
      '[[稲作労働時間]]は[[38%]]低減したが、水管理・草刈りは[[24%]]の低減にとどまる。開水路の[[管路化]]と[[自動給水栓]]で配水と水位管理を自動化し、[[畦畔の拡幅]]と[[法面被覆]]で[[リモコン草刈機]]が稼働できる[[勾配]]にする。人が担う管理量を減らし、少人数でも保全管理を続けられる。'),
    c('kaiketsu','解決策③ {{多面的機能支払}}の広域化と主体の多様化とは？',
      '活動組織を集落の枠を超えて[[広域化]]し、[[事務の一元化]]で負担を軽減する。[[市町村の仲介]]で企業、学校、非農業者との[[マッチング]]を進め、担い手以外の人材を確保する。[[管理区域]]と[[点検履歴]]を[[GIS]]で共有する。共同活動を維持し、農村社会の持続性を確保する。'),
    c('risk','技術的リスクと対策は？',
      '管路化と自動給水栓により[[水路が地下化]]し、[[目視点検]]の機会が失われて漏水等の発見が遅れる。傾斜地の管路では[[水撃作用]]や[[残留空気]]による事故も生じやすい。対策は流量と圧力に管理値を設定した遠隔監視、[[空気弁]]と[[減圧弁]]の適正配置、及び手動操作手順のマニュアル化。'),
    c('risk','社会的リスクと対策は？',
      '広域化により集落単位の[[当事者意識]]が薄れ、日常の見回り等が[[形骸化]]する。[[広域組織]]内でも条件の良い地区と不利な地区で[[管理水準の格差]]が生じる。対策は集落ごとの管理区域と[[最低限の水準]]を協定に明記し、[[地区別の便益]]と負担額を可視化してオンライン協議も併用して合意を得る。'),
    c('youken','技術者倫理の観点は？',
      '[[高齢者や非農家]]が参加する共同活動は法面の草刈りや見回り時の[[転落]]が公衆の安全に直結する。[[危険度]]を評価して機械化と法面被覆で[[立入りを減らす区域]]を示す。残る危険と責任範囲を隠さず示し、[[データの帰属]]と利用範囲を定める。'),
    c('youken','社会の持続可能性の観点は？',
      '経済面は{{LCC評価}}で整備水準を適正化し負担を抑える。環境面は管路化による[[水域の分断]]に対し[[水田魚道]]等を組み込む。社会面は小規模農家や非農家を排除しない場を設け、棚田等の[[景観]]と多面的機能を次世代へ継承する。'),
    c('mensetsu','広域化すると、かえって小規模集落の声が届きにくくなりませんか。',
      'そのリスクは認識しており、対策として集落ごとの管理区域と最低限の水準を協定に明記し、地区別の便益と負担額を可視化してオンライン協議も併用することで、広域組織の中でも個々の集落の意見を拾えるようにしている。'),
    c('mensetsu','担い手以外の人材(企業や学校)にどこまで任せられるのですか。',
      '水路の見回りや草刈りなど定型的な保全作業はマッチングにより担ってもらう一方、管理計画の策定や水利用の意思決定は土地改良区や地域の協議会が担う。役割を切り分けることで、専門的な判断は地域に残しつつ労力不足を補う設計とした。')
  ])},
  {id:'hisu1-d06', subject:'hisu1', title:'06 環境と調和のとれた農業生産への転換', sub:'最重要課題: 環境と調和のとれた農業生産への転換', cards: docCards([
    c('saijuyo','なぜ「環境と調和のとれた農業生産への転換」が最重要課題か？',
      '[[令和9年度]]から環境負荷低減の{{クロスコンプライアンス}}が[[本格実施]]され、これは全ての[[補助事業]]に共通する要件となる。したがって②③に掲げた整備も環境負荷低減を組み込まなければ前提を欠く。①の転換により②③の取組が[[国民の理解]]を得て継続し、農業農村の振興に至る。'),
    c('kaiketsu','解決策① 水管理制御による水田由来メタンの削減とは？',
      '{{資材投入型}}の対策より基盤整備で担保できる水管理を主軸とする。用排水を分離し、自動給水栓と[[落水栓]]で湛水深と落水時期を制御する。地下水位制御の併用で[[乾田化]]し、{{中干し期間の延長}}と[[稲わらの分解]]を早める[[秋耕]]を行う。[[還元期間]]を短縮し、収量を落とさずメタンを削減し、環境と両立した米生産を定着させる。'),
    c('kaiketsu','解決策② 施設の更新に合わせた省エネルギー化と再生可能エネルギーの導入とは？',
      '機能保全計画で[[更新期]]の施設を受益面積と[[揚程]]で評価し集約・再編して、管水路化による[[自然圧利用]]で[[ポンプ動力]]を減らす。残るポンプは[[実揚程]]と運転時間に応じ[[高効率機種]]とし、[[余剰落差]]に[[小水力発電]]を併設する。運用時の排出量と維持管理費を削減し、賦課金負担を抑えて事業を継続する。'),
    c('kaiketsu','解決策③ 有機農業の生産団地の形成を支える基盤整備とは？',
      '[[機械除草]]を可能とするため畦畔を拡幅し[[法面を緩傾斜化]]する。雑草抑制の[[深水管理]]には自動給水栓を用いる。[[区画整理]]により[[用水系統]]を独立させ、隣接圃場からの[[農薬・肥料の混入]]を防ぐ。団地単位で面的に整備し、有機農業の[[産地形成]]と、環境価値を付加した農産物による所得向上につなげる。'),
    c('risk','技術的リスクと対策は？',
      '地区内の用排水を分離して落水を制御すると地区内からの[[還元水量]]が減少し、これを[[反復利用]]してきた下流地区の用水計画が成立しなくなるおそれがある。流域単位で[[水収支]]を再計算して[[取水量]]と番水計画を見直し、代かき期の[[需要ピーク]]は既設[[調整池]]の運用変更で補う。'),
    c('risk','社会的リスクと対策は？',
      '{{中干しの延長}}は収量に影響しうるため[[営農者]]が制御に従わなければ地区の[[削減量]]を確保できない。ICT機器も[[更新周期]]が短く維持管理費を押し上げる。水管理と収量を圃場単位で共有して[[延長日数]]を個別に緩和し、機器は手動操作を残し機能保全計画に位置付ける。'),
    c('youken','技術者倫理の観点は？',
      '環境負荷低減の効果を過大に示さない。[[J-クレジット]]や[[見える化]]の[[算定根拠]]と、削減量が気象で変動する[[不確実性]]を開示し、公衆の利益を優先する。'),
    c('youken','社会の持続可能性の観点は？',
      '環境面は[[掘削残土]]や[[資材製造時のCO2]]、水域の分断を事業全体で評価する。経済面は[[有機転換]]の収量減とICT維持費が[[小規模経営]]を排除しないよう支援策と組み合わせる。社会面は非農家も含む協議の場を設け、[[環境価値の便益]]を地域に還元する。'),
    c('mensetsu','{{中干し期間の延長}}は農家の理解が得られにくいと思いますが、どう進めますか。',
      '水管理と収量を圃場単位で共有し、一律の延長日数ではなく個々の圃場の状況に応じて緩和できるようにしている。機能保全計画に手動操作を残すことで営農者の裁量も確保し、負担感を抑えながら削減量を積み上げる考え方である。'),
    c('mensetsu','有機農業への転換は収量が下がりますが、経営的に成り立つのですか。',
      '区画整理と機械除草・深水管理で労力の増加を抑えつつ、環境価値を付加した農産物として販売することで収量減を所得面で補う設計としている。加えて小規模経営が取り残されないよう、収量減とICT維持費を支援策と組み合わせることを前提としている。')
  ])},

  {id:'kyotsu-ichigo', subject:'kyotsu', title:'核② 一語チェック12', sub:'行数を詰める過程で最も落ちやすい「一語」を直接問う(全科目共通)', cards: docCards([
    c('ichigo','「20年後の担い手の中心となる60歳未満層は約2割」に足りない一語は？',
      '[[現在]]。正しくは「20年後の担い手の中心となる60歳未満層は[[現在]]約2割にとどまる」(＝25万人程度)。落とすと将来予測に読めてしまう。',

      '国土強靱化実施中期計画(第1次)の計画期間は[[令和8〜12年度]]、事業規模はおおむね[[20兆円強]]程度。',

      '汎用化整備率とは、30a程度以上の区画に整備された田であって、暗渠排水の設置等により[[地下水位70cm以深]]かつ[[湛水排除時間4時間以下]]の田の割合をいう。',

      '防災重点農業用ため池とは、ため池工事特措法に基づき、決壊による水害等で周辺区域に被害を及ぼすおそれがあるものとして都道府県が指定した農業用ため池をいう。',

  {id:'sentaku3-01', subject:'sentaku3', title:'01 R3Ⅲ-1 水理システムの再構築', sub:'最重要課題: 施設ストックの適正化', cards: docCards([
    c('jyoken','水管理の省力化\n\n内容と根拠データは？',
      '土地改良区は組合員の高齢化・減少により運営体制が脆弱化し、専任職員を置けないものが約[[5割]]に上る。稲作の労働時間は全体で[[38%]]低減したが、水管理・草刈り等は[[24%]]の低減にとどまる。そのため、[[労働力の制約]]の観点から、[[管理主体が減少しても日々の送配水を継続できる状態の確保]]が課題である。'),
    c('jyoken','施設ストックの適正化\n\n内容と根拠データは？',
      '基幹的農業水利施設は標準耐用年数を超過したものが約[[6割]]、基幹的水路で約[[5割]]に達する。早急な対策が必要な基幹的水路は約[[4,200km]]に及ぶが、今後5年間で更新に着手するのは約[[1,100km]]にとどまる。そのため、[[農業水利施設の維持管理]]の観点から、[[施設の量と配置を需要の実態に合わせ、限られた投資で必要な機能を維持できる状態の確保]]が課題である。'),
    c('jyoken','管理費用の抑制\n\n内容と根拠データは？',
      '用排水機場は電気料金の変動を受けやすく、賦課金の高騰は農業経営を圧迫する。土地改良区は約[[7割]]が受益面積[[300ha未満]]と小規模で賦課金収入が乏しい。加えて労務単価と資材価格の上昇が更新費を押し上げている。そのため、[[営農の持続性]]の観点から、[[施設の高度化を進めても管理費が経営を圧迫しない状態の確保]]が課題である。'),
    c('saijuyo','なぜ「施設ストックの適正化」が最重要課題か？',
      '①の省力化投資も③の費用対策も、[[施設の量と配置が需要とずれたまま]]では更新のたびに過大な投資を繰り返す。機能保全計画による延命だけでも当面はしのげるが、ずれは解消されない。系統そのものを組み替える。'),
    c('kaiketsu','解決策① 用水系統の再編と施設の集約・統廃合とは？',
      '受益面積と営農の変化を踏まえて用水計画を見直し、系統を組み替える。水田の畑地利用や品種の複数導入によりピーク用水量が減る地区では、[[二か所の頭首工を統合]]するなど施設数そのものを減らす。ポンプ掛かりの受益面積を最小化し、可能な区間は[[管路化して自然流下に転換]]する。これにより管理対象と更新費が減り、機能の持続的な確保に資する。'),
    c('kaiketsu','解決策② ICTを活用した送配水管理の高度化とは？',
      '従来は送配水を職員の経験に依存し、機側操作が多い。基幹施設の[[遠方監視・遠方操作]]と分水の自動化を進め、[[最適配水シミュレーション]]により配水計画を立てる。末端では[[自動給水栓]]と[[水位センサ]]を導入する。導入は施設の重要度と管理体制に応じ優先順位を定める。あわせて操作記録を蓄積し次の見直しの根拠とする。これにより少人数でも再編後の系統を運用できる。'),
    c('kaiketsu','解決策③ 再生可能エネルギーと省エネによる管理費の内部化とは？',
      '落差のある地区では[[小水力発電]]を検討する。土地改良区の使用電力量に対する小水力等の発電割合は[[37%以上]]が目標とされており、売電収入と自家消費で電力費を賄える余地がある。あわせて[[高効率ポンプ]]を採用する。これにより再編後の施設を維持する原資が地区内で確保できる。'),
    c('risk','リスク① 需給ギャップの発生と対策は？',
      '系統を再編しても、事前の配水計画に基づき供給側が操作する[[供給主導型]]のままでは、時間的・局所的な水不足や無効放流が生じるリスクがある。対策として、幹線と支線の分岐点に[[ファームポンド]]や調整池を設け、送水のタイムラグと時間単位の変動を吸収する。開水路系は[[下流水位制御]]へ転換する。'),
    c('risk','リスク② 既得の水利慣行との齟齬と対策は？',
      '頭首工の統合は取水地点と取水の順序を変えるため、長年の[[水利慣行]]との齟齬を生み、受益者間に不公平感が生じるリスクがある。対策として水量の計算根拠を公開し、手順と経過を明示した協議を重ねて段階的に移行する。移行中は流量を実測して効果を検証し、必要に応じ[[番水]]等の配分方法も見直す。'),
    c('risk','リスク③ 保守を担う技術者の不足と対策は？',
      '遠方監視や発電設備の導入は、機器の保守と制御設定という技術を管理者に求める。専任職員が不在の土地改良区では対応できず、機器が[[形骸化]]するリスクがある。対策として研修と技術支援の体制を整え、複数の土地改良区や市町村が連携した[[保守体制]]を整備する。'),
    c('mensetsu','施設ストックの適正化を最重要とした理由を、①省力化・③費用対策との関係で説明してください。',
      '①の省力化投資も③の費用対策も、施設の量と配置が需要と噛み合っていなければ、その都度の投資が過大になり続ける。機能保全計画による延命では量と配置のずれ自体は解消できないため、まず系統を組み替えて需要と施設を対応させることを優先した。'),
    c('mensetsu','頭首工の統合のような大きな変更を進める際、地域との合意形成はどう進めますか。',
      '水量の計算根拠を公開し、手順と経過を明示した協議を重ねながら段階的に移行する。移行の過程では実際の流量を測定して効果を検証し、必要であれば番水等の配分方法も見直すことで、受益者間の不公平感を抑える。')
  ])},
  {id:'sentaku3-02', subject:'sentaku3', title:'02 R3Ⅲ-2 農地整備における環境配慮', sub:'最重要課題: 取組を続ける体制の確保', cards: docCards([
    c('jyoken','大区画化に対応した配慮手法\n\n内容と根拠データは？',
      'これまでの環境配慮は水路と農地の連続性を保つ手法を中心に進められてきた。しかし今後5年間で約[[6万ha]]の大区画化が計画され、{{地下水位制御システム}}等の導入も進むため、従来の手法では水域のつながりを確保できない場面が増える。水路と農地の高低差も大きくなる。そのため、[[技術開発]]の観点から、[[区画を拡大しても水域の連続性を保てる状態の確保]]が課題である。'),
    c('jyoken','配慮施設の管理の省力化\n\n内容と根拠データは？',
      '基幹的農業従事者は[[240万人]]から[[103万人]]へ半数未満に減少し、65歳以上が[[7割]]である。大区画化により経営が大規模化すると、[[水田魚道]]や環境配慮型水路の泥上げ等が少数の担い手に集中する。そのため、[[労働力の制約]]の観点から、[[担い手が減少しても配慮施設の機能を保ち続けられる状態の確保]]が課題である。'),
    c('jyoken','取組を続ける体制の確保\n\n内容と根拠データは？',
      '環境配慮は施設を造って終わりではなく、施工後のモニタリングと手直しが必要である。一方で集落は小規模化し、[[9戸以下]]の農業集落では共同活動の実施率が急激に低下する。そのため、[[農村社会の持続性]]の観点から、[[整備後も地域が主体となって配慮を継続できる状態の確保]]が課題である。'),
    c('saijuyo','なぜ「取組を続ける体制の確保」が最重要課題か？',
      '①の新しい配慮手法も②の省力化施設も、[[施工後に状態を見て手を入れる主体]]がいなければ機能を失う。行政が直接モニタリングを担う方法もあるが、対象が広く頻度を確保できない。地域の活動に組み込む。'),
    c('kaiketsu','解決策① 調査から施工までの地域の参画とは？',
      '調査計画段階の生き物調査や施工段階の生き物の移動作業に、農家や地域住民、学校の参加を求める。参加者には対象種の[[生息条件]]と配慮施設の働きを現地で説明し、何を守るために何を造るのかを共有する。参加の記録は[[活動組織]]の名簿に残す。これにより、施設の意味を知る人が地域に残り、整備後の手入れが続く。'),
    c('kaiketsu','解決策② 多面的機能支払を活用した点検と補修の位置付けとは？',
      '水田魚道の目詰まり除去、環境配慮型水路の堆積土の除去、植生の管理を共同活動の作業項目として計画に明記する。作業の時期と頻度を生物の生活史に合わせ、[[産卵期を避ける]]など配慮の内容も併せて定め、必要な道具は共同で備える。作業に要する費用は{{多面的機能支払}}で賄う。これにより、担い手が減っても配慮施設の機能が保たれる。'),
    c('kaiketsu','解決策③ モニタリング結果を次の設計に還元する仕組みとは？',
      '施工後の生息状況と施設の変状を[[統一様式]]で記録し、土地改良区と市町村が保管して公開する。効果が出ていない工種は原因を分析し、地区内の次の工区の設計に反映する。県は専門家の助言を受けられる窓口を設ける。これにより、配慮が一度限りの取組で終わらず、地域の中で改善が続く。'),
    c('risk','波及効果と、それに伴う設計上の留意点は？',
      '波及効果として、配慮施設が[[人と自然の触れ合いの場]]となり、学校の学習や都市住民との交流の場に育つことが期待できる。人口減少が進む農村で[[関係人口]]を増やし、共同活動の担い手を地域外にも広げる効果がある。ただし利用者が増える場を造る以上、[[転落防止と動線の分離]]を設計に織り込み、管理者の負担が増えない配置とする。'),
    c('risk','懸念① 農家負担による整備内容の矮小化と対策は？',
      '配慮施設の整備費と維持管理費が農家負担となると、整備内容が縮小し、管理も粗放化する懸念がある。対策として、[[非農用地創設換地方式]]により配慮施設の用地を市町村所有地として生み出し、市町村が支払う用地費を農家負担分に充当する。あわせて[[生態系サービス]]の評価に基づく助成の活用を検討する。'),
    c('risk','懸念② 担い手の交代による取組の途切れと対策は？',
      '参画が個人の熱意に依存すると、担い手が交代した際に取組が途切れる懸念がある。対策として、モニタリングの項目と頻度を[[機能保全計画]]に位置付け、記録の保管者を明示する。引継ぎの際は現地で作業の意味を説明し、記録を手渡す。担い手が代わっても次の点検日が計画に残る。'),
    c('mensetsu','行政ではなく地域住民にモニタリングを担わせる理由は？',
      '行政が直接モニタリングを担う方法も考えられるが、対象となる配慮施設が地区全体に広がっており、頻度を確保できない。地域の共同活動に位置付けることで、日常的な目が届く頻度でモニタリングを継続できる。'),
    c('mensetsu','農家負担が整備内容を縮小させる懸念に、なぜ換地方式で対応するのですか。',
      '非農用地創設換地方式を使えば、配慮施設用地を市町村所有地として生み出せるため、その用地費を市町村が負担し、農家の負担分に充当できる。整備内容を縮小させずに、費用負担の構造そのものを変える対策である。')
  ])},
  {id:'sentaku3-03', subject:'sentaku3', title:'03 R4Ⅲ-1 水田農業の構造改革に向けた農地整備', sub:'最重要課題: 労働力不足への対応', cards: docCards([
    c('jyoken','農地の集積・集約化\n\n内容と根拠データは？',
      '担い手は、農地の分散と未整備、水路や畦畔の管理労力を理由に借受けをためらう。[[1ha以上]]の大区画は水田面積の[[6%]]にとどまり、今後5年間の大区画化の事業量も約[[6万ha]]である。分散したままでは規模を広げるほど移動時間が増す。そのため、[[土地利用]]の観点から、[[担い手が引き受けられる区画と配置に農地を整えること]]が課題である。'),
    c('jyoken','需要に応じた作物生産への転換\n\n内容と根拠データは？',
      '水田の汎用化整備率は[[48.2%]]にとどまる。麦の作付率は[[5.1%]]、大豆は[[3.4%]]であり、農地整備率の高い市町村ほど作付率が高い傾向がある。[[湿害]]は麦・大豆の単収が低く年次変動が大きい主因である。そのため、[[食料安全保障]]の観点から、[[水田で麦・大豆等を安定して作れる排水条件を確保すること]]が課題である。'),
    c('jyoken','労働力不足への対応\n\n内容と根拠データは？',
      '基幹的農業従事者は[[240万人]]から[[103万人]]へ半数未満に減少し、65歳以上が[[7割]]である。稲作の労働時間は全体で[[38%]]低減したが、水管理・草刈り等は[[24%]]の低減にとどまる。そのため、[[労働生産性]]の観点から、[[少ない人数でも現在の生産水準を維持できる状態の確保]]が課題である。'),
    c('saijuyo','なぜ「労働力不足への対応」が最重要課題か？',
      '①の集積も②の転換も、[[作業を担う人手]]が確保できなければ面積が増えても回らない。機械の大型化による能率向上も考えられるが、区画と進入路が対応していなければ能力を発揮できない。基盤の側を先に整える。'),
    c('kaiketsu','解決策① 自動走行農機に対応した区画と動線の整備とは？',
      '耕区の[[長辺長]]を機械の許容延長から定め、区画規模を最大化する。公道を通らず耕区間を移動できる通路と、旋回用の[[ターン農道]]を配置する。畦畔は草刈り機を装着したトラクターが走行できる幅とする。区画形状は[[切盛り量]]が過大にならない範囲で定め、[[法面被覆]]により草刈りの回数を減らす。これにより、少人数でも作業時間を短縮でき、生産水準を維持できる。'),
    c('kaiketsu','解決策② 水管理と畦畔管理の省力化とは？',
      '低減の遅れている水管理に的を絞る。用水路を[[パイプライン化]]し、自動給水栓と[[水位・水温センサ]]を設置して湛水深を遠隔で監視・操作できるようにする。汎用化した区画では{{地下水位制御システム}}により給排水を一体で制御する。畦畔は[[リモコン式草刈り機]]の走行能力に応じた勾配とする。これにより、見回りの回数が減り、規模を広げても生産水準を維持できる。'),
    c('kaiketsu','解決策③ 位置情報と施工データの基盤整備とは？',
      '自動走行に必要な測位精度を確保するため、[[GNSS]]に加えて[[位置補正情報]]を利用できる通信環境を整備する。ほ場整備の[[情報化施工]]で得た座標データを地図として整理し、農機の走行経路の設定に用いる。データは更新の担当と時期を定めて維持する。これにより、整備した基盤の能力が作業として引き出され、少人数での生産継続が可能となる。'),
    c('risk','リスク① 機器の高価格化による導入の断念と対策は？',
      '機械やサービスは機能の高度化に伴い価格が上昇し、労務単価と資材価格の上昇も重なって、農業者が導入できないリスクがある。対策として、機械の[[共同利用]]や[[リース方式]]を前提に計画し、導入の可否を[[経営面積]]と[[作業時間の削減量]]から判定する。制度は変わりうるため更新時の費用も含めて見込む。'),
    c('risk','リスク② 高機能な機器を使いこなせないことと対策は？',
      '自動走行や遠隔制御は、設定と保守という新たな技術を農業者に求めるため、機器が十分に使われないリスクがある。対策として、導入時の研修に加え、[[機械メーカーと農業者をつなぐ人材]]を地域に確保し、初期の設定を支援する体制を整える。操作の手順は地区で統一し記録を残す。'),
    c('risk','リスク③ 切盛りによる地力のばらつきと対策は？',
      '大区画化は切土と盛土を伴い、作土が移動して区画内で地力と排水性が不均一になるリスクがある。対策として、[[表土を剥ぎ取って戻す施工]]とし、盛土部は[[心土破砕]]を行う。整備後は土壌調査により是正の要否を判定し、必要に応じ客土や有機物の投入を行う。盛土部は初期の数年、収量を追跡する。'),
    c('mensetsu','労働力不足への対応を最重要とした理由は？',
      '農地の集積・集約化も需要に応じた作物転換も、実際に作業を担う人手が確保できなければ実行に移せない。機械の大型化で能率を上げる方法も考えられるが、区画と進入路がそれに対応していなければ能力を発揮できないため、まず基盤側を整えることを優先した。'),
    c('mensetsu','汎用化整備率が48.2%にとどまる要因をどう見ていますか。',
      '水田は地下水位が高く、麦・大豆といった畑作物は湿害を受けやすいため単収が低く年次変動も大きい。実需者が求める数量と品質を安定的に供給できないことが、汎用化が進まない主因と考えている。')
  ])},
  {id:'sentaku3-04', subject:'sentaku3', title:'04 R4Ⅲ-2 農村における防災・減災(ハード・ソフト両面)', sub:'最重要課題: ため池の決壊の防止', cards: docCards([
    c('jyoken','ため池の決壊の防止\n\n内容と根拠データは？',
      '農業用ため池は全国に約[[15万か所]]あり、うち約[[5万2千か所]]が防災重点農業用ため池に指定されている。防災工事等推進計画に位置付けられた約[[9千か所]]のうち、約[[4千8百か所]]が未着手である。多くは近代的な基準によらず築造されている。そのため、[[人命保護]]の観点から、[[決壊による人的被害を確実に防げる状態の確保]]が課題である。'),
    c('jyoken','排水機能の確保\n\n内容と根拠データは？',
      '1時間降水量50mm以上の年間発生回数は、昭和51〜60年の約[[226回]]に対し直近10年は約[[330回]]と約[[1.5倍]]に増加している。既設の排水施設は過去の実績降雨に基づき計画されており、湛水被害は能力を超えた時点で一気に広がる。そのため、[[気候変動適応]]の観点から、[[将来の降雨を見込んだ排水能力の確保]]が課題である。'),
    c('jyoken','流域での負担の分担\n\n内容と根拠データは？',
      '水田の雨水貯留の取組面積は、水田面積の[[23.5%]]に達する[[北海道]]に対し[[北海道以外]]では[[2.2%]]にとどまる。一方、取組目標は[[17万ha]]である。湿害や利水への影響に対する農業者の懸念も残る。そのため、[[国土保全]]の観点から、[[営農の安定性を保ちつつ流域の洪水ピークを農地の側で分担して低減させること]]が課題である。'),
    c('saijuyo','なぜ「ため池の決壊の防止」が最重要課題か？',
      '②と③は被害を軽減する対策だが、ため池の決壊は下流の人命を直接奪う不可逆な被害であり、優先度が異なる。[[全てのため池を一律に改修する方法]]もあるが、指定数からみて期間と体制の面で成立しない。優先度を付けて進める。'),
    c('kaiketsu','解決策① 評価に基づく優先順位の設定とは？',
      '劣化状況評価と地震・豪雨耐性評価を、貯水量、浸水想定区域内の家屋数、防災拠点や緊急輸送道路への影響の大きさにより順位を付けて実施する。評価は劣化状況の把握と{{健全度指標}}に対する堤体の安定性の照査を含む。基準は地域の実情に応じて定め記録に残す。これにより、限られた期間でも危険度の高いものから安全性を確保できる。'),
    c('kaiketsu','解決策② 優先度に応じた防災工事と統廃合とは？',
      '評価結果に応じて工法を選ぶ。地震に対しては堤体の[[締固め]]や[[押え盛土]]により安定性を高め、豪雨に対しては[[洪水吐き]]の断面を拡大する。パイピングによる漏水が生じているものは早急に改修する。農業利用が乏しく管理が困難なものは代替水源を確保したうえで堤体を[[開削]]し廃止する。工法は{{LCC評価}}で比較する。これにより下流の被害要因そのものを除ける。'),
    c('kaiketsu','解決策③ ソフト対策による避難の確保とは？',
      'ハード対策の完了までの期間も被害を防ぐ必要がある。[[ハザードマップ]]を作成して浸水想定区域の住民と共有し、[[水位計]]と[[監視カメラ]]による遠隔監視を導入する。[[ため池防災支援システム]]により点検対象を抽出し、市町村と管理者の連絡経路を定める。[[ため池管理アプリ]]により点検結果を現地で報告できるようにする。これにより、決壊に至る場合でも人的被害を避け、農村の安全・安心な暮らしを守れる。'),
    c('risk','リスク① 多面的機能の喪失と対策は？',
      '堤体の締固めや洪水吐きの拡大は法面の植生と水際を改変し、廃止は水面そのものを失わせるため、親水空間、景観、生物多様性の機能を失うリスクがある。対策として、事前調査と環境モニタリングを行い、工事後も調査を続ける。廃止には[[利水者の同意]]を要するため水源の代替案を先に示し、周辺の水域とのつながりは別の形で残す。'),
    c('risk','リスク② 優先度を下げたため池での被災と対策は？',
      '順位を付ける以上、後回しにしたため池が先に被災するリスクがある。対策として、順位の判断に用いた項目と重みをあらかじめ規程に定め、外力の想定や浸水想定区域内の家屋数が変わった場合には順位を見直す。見直しの結果は管理者と住民に説明する。'),
    c('risk','リスク③ 遠隔監視への依存と対策は？',
      '水位計や監視カメラは、[[停電]]や[[通信の途絶]]により機能せず、かえって判断を誤らせるリスクがある。対策として、通信が途絶した場合の現地確認の手順と参集の基準を定め、訓練を反復する。機器は[[非常用電源]]を備え、安全側の値を表示する設定とする。'),
    c('mensetsu','全てのため池を一律に改修しないのは、危険なため池を放置することにならないですか。',
      '放置ではなく優先順位付けであり、判断に用いた項目と重みをあらかじめ規程として明文化し、外力の想定や周辺の住宅立地といった条件が変わった場合には順位を見直す仕組みにしている。後回しにしたため池で被災するリスク自体を、対策すべきリスクとして別途位置付けている。'),
    c('mensetsu','ため池を廃止する際、利水者の同意が得られない場合はどうしますか。',
      '水源の代替案を先に示すことを前提としており、同意が得られない場合は廃止ではなく改修による存置を選択する。廃止はあくまで農業利用が乏しく管理が困難なため池に限定した選択肢であり、利水機能を一方的に奪う判断はしない考え方である。')
  ])},
  {id:'sentaku3-05', subject:'sentaku3', title:'05 R5Ⅲ-1 農業水利施設を適切に次世代に継承', sub:'最重要課題: 管理労力の低減', cards: docCards([
    c('jyoken','農業水利インフラの持続的機能保全\n\n内容と根拠データは？',
      '基幹的農業水利施設は標準耐用年数を超過したものが約[[6割]]、基幹的水路で約[[5割]]に達し、突発事故は年間約[[1,900件]]に上る。早急な対策が必要な基幹的水路は約[[4,200km]]に及ぶが、今後5年間で更新に着手するのは約[[1,100km]]にとどまる。そのため、[[農業水利施設の維持管理]]の観点から、[[更新需要に投資が追いつかない中で施設機能を持続的に確保すること]]が課題である。'),
    c('jyoken','劣化状態の把握\n\n内容と根拠データは？',
      '基本的な劣化診断は近接目視や打音による調査であり、[[UAV]]等の活用で調査可能な施設は増えたが、通水中の水路や地中埋設の管路など詳細な調査が困難な場面は依然として多い。また、末端の用排水路は延長が長く、点検結果が記録として蓄積されず、劣化の進行を比較できない。そのため、[[リスク管理]]の観点から、[[点検が困難な施設についても健全度を把握できる状態の確保]]が課題である。'),
    c('jyoken','管理労力の低減\n\n内容と根拠データは？',
      '大区画化や高収益作物への転換により水需要は複雑化し、管理対象も多様化する。土地改良区は組合員の減少に加え、約[[7割]]が受益面積[[300ha未満]]と小規模で賦課金収入が乏しく、専任職員を置けないものが約[[5割]]に上る。そのため、[[労働生産性]]の観点から、[[管理主体が減少しても日常の水管理と維持管理を継続できる状態の確保]]が課題である。'),
    c('saijuyo','なぜ「管理労力の低減」が最重要課題か？',
      '①の更新投資も②の診断結果も、日常の管理を担う主体が残っていなければ活かされない。不足する労力は[[管理委託の拡大]]でも補いうるが、受託者の確保と費用の増加という別の制約を生む。まず施設側の構造と運用で労力そのものを減らす。'),
    c('kaiketsu','解決策① 開水路のパイプライン化による水管理方式の転換とは？',
      'パイプラインは地形条件から受ける制約が小さく路線計画の自由度が高い。[[供給主導型]]から[[需要主導型]]の水管理へ転換でき、開水路で必要な泥上げや草刈りも不要となる。更新の機会をとらえ、必要水頭と管内流速を確認したうえで、管理負担の大きい区間から順に管路化する。これにより、少人数でも配水を継続でき、次世代が引き継げる管理量となる。'),
    c('kaiketsu','解決策② ICT・AIを活用した監視と操作の遠隔化とは？',
      '基幹施設に[[遠方監視・遠方操作]]を導入し、機側操作を削減する。末端では[[自動給水栓]]と水位センサで配水を自動化する。あわせて画像から劣化を判定する技術を点検に組み込み、状態把握と接続する。これにより、職員の経験に依存しない管理が可能となり、世代交代後も同水準の供給を継続できる。'),
    c('kaiketsu','解決策③ 維持管理を考慮した構造・付帯施設の計画とは？',
      '施設の更新に際し、管理用道路の幅員確保、法面の[[緩勾配化]]や張ブロック等による草刈りの軽減、[[除塵機]]の自動化を織り込む。空気弁や制水弁は点検と更新が容易となる位置に配置し、保護施設を設ける。これにより、日常の作業量そのものが減り、将来の管理者の負担を抑えられる。'),
    c('risk','リスク① 関係者の理解と合意の不足と対策は？',
      '需要主導型への転換は取水の順序や慣行を変えるため、受益者の理解が得られず所定の効果が出ないリスクがある。対策として、[[地域計画]]の協議の場を活用し、営農計画と管理の将来像、費用負担の見通しを共有したうえで段階的に移行する。移行中は流量と操作回数を実測し、労力の削減量を数値で示して合意を重ねる。'),
    c('risk','リスク② 維持管理費の増大と対策は？',
      'ICT機器や自動給水栓の導入は、通信費と更新費という新たな費用を生み、労力の軽減と引き換えに費用負担が増すリスクがある。対策として、管理水準と費用負担の均衡を踏まえて仕様を定め、複数の土地改良区による[[共同調達]]と[[共同保守]]により単価を下げ、{{LCC評価}}で比較して機種を選定する。'),
    c('risk','リスク③ 末端の共同活動の場の喪失と対策は？',
      'パイプライン化により泥上げ等の共同作業が不要となる結果、集落が施設に触れる機会が失われ、異常の早期発見が働かなくなるリスクがある。対策として、{{多面的機能支払}}を活用して点検と軽微な補修を共同活動に位置付け直し、{{水土里ビジョン}}で役割分担を明確化する。'),
    c('mensetsu','パイプライン化で共同活動の場が失われるなら、あえて開水路を残す選択肢はないのですか。',
      '開水路を残す選択肢も否定しないが、この答案では水管理労力の低減を最重要課題としているため、パイプライン化による省力化を優先している。その代わりに生じる共同活動の場の喪失というリスクには、多面的機能支払と水土里ビジョンで点検・補修の役割を位置付け直すことで対応する考え方である。'),
    c('mensetsu','需要主導型への転換について、受益者の理解が得られない場合はどう進めますか。',
      '地域計画の協議の場を活用し、営農計画と管理の将来像、費用負担の見通しを共有した上で段階的に移行することにしている。一括転換ではなく、移行中に流量と操作回数を実測して削減効果を数値で示しながら、合意を積み重ねる進め方である。')
  ])},
  {id:'sentaku3-06', subject:'sentaku3', title:'06 R5Ⅲ-2 ため池の保全管理を含めた防災・減災', sub:'最重要課題: 安全性の評価と補強の着実な実施', cards: docCards([
    c('jyoken','ため池の実態の把握\n\n内容と根拠データは？',
      '農業用ため池は全国に約[[15万か所]]あり、うち約[[5万2千か所]]が防災重点農業用ため池に指定されている。一方、所有者や管理者の世代交代により権利関係が不明確なものや、既に廃止・荒廃しているものが混在する。そのため、[[リスク管理]]の観点から、[[対策の対象と優先度を判断できるだけの実態を把握すること]]が課題である。'),
    c('jyoken','日常の保全管理体制の確保\n\n内容と根拠データは？',
      'ため池は利用者を主体とする組織が管理してきたが、離農と高齢化により組織が弱体化し、専任職員が不在の土地改良区も約[[5割]]を占める。国、都道府県、市町村、所有者の役割分担も明確でない。そのため、[[農村社会の持続性]]の観点から、[[日常の点検と管理を誰が担うかを定め、継続できる状態の確保]]が課題である。'),
    c('jyoken','安全性の評価と補強の着実な実施\n\n内容と根拠データは？',
      '防災工事等推進計画に位置付けられた約[[9千か所]]のうち、約[[4千8百か所]]が未着手である。多くは近代的な基準によらず築造され、経年劣化も進む。工事着手割合[[9割以上]]が目標とされている。そのため、[[防災・減災]]の観点から、[[限られた期間と体制の中で危険度の高いものから安全性を確保すること]]が課題である。'),
    c('saijuyo','なぜ「安全性の評価と補強の着実な実施」が最重要課題か？',
      '①の把握も②の体制も、決壊の危険が現に高いため池を残したままでは間に合わない。[[全てを評価してから工事に入る手順]]も考えられるが、未着手数からみて時間を要しすぎる。評価と工事を優先度に沿って並行させる。'),
    c('kaiketsu','解決策① 評価の優先度の設定とは？',
      '劣化状況評価は、貯水量、浸水想定区域内の家屋数、公共施設の重要度により順位を付けて実施する。地震・豪雨耐性評価は、決壊により防災拠点や緊急輸送道路の機能に支障が生じるもの、周辺の居住者に甚大な被害を及ぼすものを優先する。順位は[[毎年見直し]]、年度ごとの実施計画に落として進捗を公表する。これにより、限られた体制でも危険度の高いものから評価が進む。'),
    c('kaiketsu','解決策② 評価結果に応じた工法の選定とは？',
      '地震に対しては、{{健全度指標}}に対する堤体の安定性を照査し、締固めや押え盛土により変形を許容範囲に収める。豪雨に対しては、洪水吐きの断面を拡大して越流を防ぐ。パイピングによる漏水があるものは早急に改修し、農業利用が乏しいものは代替水源を確保して堤体を開削し廃止する。工法は{{LCC評価}}で比較する。これにより被害の要因を確実に除ける。'),
    c('kaiketsu','解決策③ 技術と体制の補完とは？',
      '多数のため池を抱える地域では、市町村の技術者だけでは評価と工事の監理が回らない。[[ため池サポートセンター]]による技術的な指導と助言を受け、[[ため池防災支援システム]]により点検対象を自動で抽出する。工事は複数か所を一括して発注し、発注時期を平準化する。管理者への研修も併せて行う。これにより、体制の制約の中でも計画どおりに進む。'),
    c('risk','リスク① 工事不要と判断したため池の経年劣化と対策は？',
      '評価により防災工事は不要と判断したものも、堤体や洪水吐きの劣化は進行し、設計を上回る外力や浸水想定区域内への新たな住宅の立地といった条件の変化も起こりうる。対策として、[[再評価を行う条件]]をあらかじめ規程に定め、定期点検の結果を関係者で共有する。点検の記録は市町村が保管する。'),
    c('risk','リスク② 評価と工事を担う技術者の不足と対策は？',
      '労務単価は約[[18%]]、建設資材価格は約[[23%]]上昇し、建設業には[[時間外労働の上限規制]]も適用された。工事量を短期に集中させると、受注者が確保できない懸念がある。対策として、複数年にわたる発注計画を市町村が示し、県が設計と積算を技術的に支援する。工期は出水期を避けて設定する。'),
    c('risk','リスク③ 遠隔監視への依存と対策は？',
      '水位計や監視カメラの導入は、[[停電]]や[[通信の途絶]]により機能せず、かえって判断を誤らせる懸念がある。対策として、通信が途絶した場合の現地確認の手順と参集の基準を定め、訓練を反復する。機器は[[非常用電源]]を備え、安全側の値を表示する設定とする。'),
    c('mensetsu','評価と工事を並行させると聞きましたが、体制が足りるのですか。',
      '市町村の技術者だけでは監理が回らないことを想定しており、ため池サポートセンターによる技術的な指導や、ため池防災支援システムによる点検対象の自動抽出を組み合わせて体制を補完している。また工事を複数か所一括発注し発注時期を平準化することで、限られた体制でも計画通り進められるようにしている。'),
    c('mensetsu','工事不要と判断したため池は、その後は放置してよいのですか。',
      '放置ではなく、再評価を行う条件をあらかじめ規程に定めている。設計を上回る外力の想定や、浸水想定区域内への新たな住宅立地といった条件の変化があった場合には再評価する仕組みにしており、一度の判断で終わらせない考え方である。')
  ])},
  {id:'sentaku3-07', subject:'sentaku3', title:'07 R6Ⅲ-1 用水路のパイプライン化', sub:'最重要課題: 水管理労力の低減', cards: docCards([
    c('jyoken','将来の営農への追随性\n\n内容と根拠データは？',
      '計画・設計では水利用条件と土地利用を確認する必要がある。経営規模の拡大に伴う農作業の長期化、水田から高収益作物への転換による用水の時期と量の変化、気象の変化による用水需要の変動が想定される。そのため、[[水利用]]の観点から、[[整備後の営農の変化にも追随できる用水量と配水方式を定めること]]が課題である。'),
    c('jyoken','水管理労力の低減\n\n内容と根拠データは？',
      '農業水利施設は土地改良区等により維持管理されているが、組合員の高齢化・減少により運営体制が脆弱化し、専任職員が不在の土地改良区が約[[5割]]を占める。一方で農地集積により、管理者が受け持つ農地は広範囲に分散している。そのため、[[労働力の制約]]の観点から、[[管理主体が減少しても送配水を継続できる状態の確保]]が課題である。'),
    c('jyoken','突発事故の未然防止\n\n内容と根拠データは？',
      'パイプラインは地中埋設構造物であり、口径や通水の制約から管体の直接調査が困難な場合が多い。また圧力管路であるため、局所の性能低下が系統全体の機能喪失に直結する。近年は管の破損による[[道路の陥没]]など、社会的な影響の大きい事故も生じている。そのため、[[リスク管理]]の観点から、[[直接調査が難しい管路の健全度を把握し、事故を未然に防ぐこと]]が課題である。'),
    c('saijuyo','なぜ「水管理労力の低減」が最重要課題か？',
      '①の需要への追随も③の事故の防止も、日々操作と点検を行う主体が確保できなければ実行に移らない。不足する労力は[[管理委託の拡大]]でも補いうるが、受託者の確保と費用の増加という別の制約を生む。まず施設側で操作点数そのものを減らす。'),
    c('kaiketsu','解決策① ICT水管理システムによる送配水の遠隔化とは？',
      '従来は上流の都合で配水する[[供給主導型]]であり、機側操作が多い。基幹施設の遠方監視・遠方操作と分水の自動化を進め、[[最適配水シミュレーション]]により配水計画を立てる。末端では[[多機能型自動給水栓]]を導入する。導入は施設の重要度と管理体制に応じて優先順位を定める。これにより、限られた人員でも需要主導型の送配水を継続できる。'),
    c('kaiketsu','解決策② 用水系統の再編による操作点数の削減とは？',
      '受益面積や営農の変化に応じ、用水計画の見直しにあわせて系統そのものを組み替える。分水工を統廃合して[[ブロック化]]し、操作の対象を絞る。ポンプ掛かりの受益面積を最小化する系統に変更し、[[省エネ型ポンプ]]を採用する。再編に当たっては、水利権と受益の変更について関係者の同意を先に得る。これにより、操作の手数と電力費の双方から管理の負担を減らせる。'),
    c('kaiketsu','解決策③ 維持管理を考慮した付帯施設の計画とは？',
      'パイプラインの機能は[[空気弁]]、[[制水弁]]、[[排泥弁]]などの付帯施設の操作により保たれる。これらは点検と更新が容易な位置に配置し、保護施設を設ける。管理用道路と点検口を計画段階で確保し、通水を止めずに作業できる構造とする。これにより、日常の作業量が減り、少人数でも適切な用水供給を維持できる。'),
    c('risk','リスク① 圧力管路特有の事故の誘発と対策は？',
      '遠隔操作と自動化は、弁やゲートの急閉を招きやすく、[[水撃圧]]や[[負圧]]による管の損傷というリスクを新たに生む。対策として、[[非定常水理計算]]により操作条件を検証し、緩閉式弁の採用や操作速度の上限を制御に組み込む。空気弁とサージタンクの配置も併せて見直し、異常時には施設が安全側に停止する制御とする。'),
    c('risk','リスク② 維持管理費の増大と対策は？',
      'ICT機器や自動給水栓は、通信費と更新費という新たな費用を生み、労力の軽減と引き換えに費用負担が増すリスクがある。対策として、{{LCC評価}}で仕様を比較して機種を定め、複数の土地改良区による共同調達と共同保守により単価を下げる。あわせて[[更新積立金制度]]により将来費用を平準化する。'),
    c('risk','リスク③ 系統再編による冗長性の喪失と対策は？',
      '分水工の統廃合は操作点数を減らす一方、代替経路が失われ、一箇所の事故が広範囲の断水に及ぶリスクを生む。対策として、再編後の系統ごとに[[断水影響区域]]を算定し、影響の大きい区間には[[連絡管]]や制水弁を残す。緊急時の給水手順を管理規程に定める。'),
    c('mensetsu','系統を再編して分水工を減らすと、かえって事故に弱くなりませんか。',
      'その点は新たに生じるリスクとして認識しており、再編後の系統ごとに断水影響区域を算定した上で、影響の大きい区間には連絡管や制水弁を残すことで冗長性を確保している。操作点数を減らすことと、事故時の代替経路を確保することを両立させる設計にしている。'),
    c('mensetsu','遠隔操作の導入で水撃圧のリスクが増えるなら、自動化しない方がよいのではないですか。',
      '水管理労力の低減が最重要課題である以上、自動化自体は不可欠と考えている。そのリスクには、非定常水理計算による操作条件の事前検証と、緩閉式弁の採用、操作速度の上限設定という設計的な対策で対応し、自動化のメリットを維持したままリスクを抑える考え方である。')
  ])},
  {id:'sentaku3-08', subject:'sentaku3', title:'08 R6Ⅲ-2 ほ場整備を通じた地域農業の課題解決', sub:'最重要課題: 担い手への農地の集積・集約化', cards: docCards([
    c('jyoken','担い手への農地の集積・集約化\n\n内容と根拠データは？',
      '1ha以上の大区画は水田面積の[[6%]]にとどまり、分散した未整備のほ場は移動と畦畔管理の負担となって借受けを妨げる。基幹的農業従事者は[[240万人]]から[[103万人]]へ半数未満に減少している。[[集積]]と[[集約化]]は別の概念であり、面積を増やすだけでは分散は解消しない。そのため、[[土地利用]]の観点から、[[担い手が引き受けられる区画と配置に農地を整えること]]が課題である。'),
    c('jyoken','需要に応じた生産への転換\n\n内容と根拠データは？',
      '水田の汎用化整備率は[[48.2%]]にとどまる。麦の作付率は[[5.1%]]、大豆は[[3.4%]]であり、農地整備率の高い市町村ほど作付率が高い傾向がある。湿害は麦・大豆の単収が低く年次変動が大きい主因である。そのため、[[食料安全保障]]の観点から、[[水田で麦・大豆等を安定して作れる排水条件を確保すること]]が課題である。'),
    c('jyoken','災害への対応力の強化\n\n内容と根拠データは？',
      '1時間降水量50mm以上の年間発生回数は、昭和51〜60年の約[[226回]]に対し直近10年は約[[330回]]と約[[1.5倍]]に増加している。整備を機に農地の側で対応する余地があり、大区画化した水田は一枚あたりの被害面積も大きい。そのため、[[防災・減災]]の観点から、[[農地からの流出と土壌の侵食を抑えられる状態の確保]]が課題である。'),
    c('saijuyo','なぜ「集積・集約化」が最重要課題か？',
      '②の転換も③の強靱化も、農地を面としてまとめて担う主体がいなければ実施の単位が作れない。[[利用権の調整のみ]]でも集積は進むが、分散したままでは移動と畦畔管理の負担が残る。換地と一体で区画を組み替える。換地の機会は事業のとき以外に得られず、逃せば分散は固定される。'),
    c('kaiketsu','解決策① 換地と一体の大区画化と団地化とは？',
      '[[地域計画]]の目標地図に即して換地を行い、担い手の農地を一箇所にまとめる。耕区の長辺長は機械の許容延長から定め、畦畔を除去して区画を拡大する。進入路と用排水の取付けも同時に組み替え、[[非農用地の創設]]も検討する。これにより、移動と管理の時間が減り、担い手が引き受けられる農地となる。'),
    c('kaiketsu','解決策② 水管理と畦畔管理の省力化とは？',
      '用水路を[[パイプライン化]]し、[[自動給水栓]]により給水を遠隔で操作できるようにする。汎用化する区画には{{地下水位制御システム}}を導入し、給排水を一体で制御する。畦畔は拡幅し、法面はリモコン式草刈り機の走行能力に応じた勾配とする。導入は経営規模と作業時間の削減量から優先順位を定める。これにより、規模を広げても管理の時間が増えない。'),
    c('kaiketsu','解決策③ 整備データの活用と自動走行への対応とは？',
      '情報化施工で得た座標データを地図として整理し、自動走行農機の走行経路の設定に用いる。測位精度を確保するため、[[位置補正情報]]を利用できる通信環境を併せて整備する。データは施工者から受け取り形式を統一する。これにより、整備した区画の能力が作業として引き出され、集積の効果が所得に届く。'),
    c('risk','リスク① 切盛りによる地力のばらつきと対策は？',
      '大区画化は切土と盛土を伴い、作土が移動して区画内で地力と排水性が不均一になるリスクがある。対策として、[[表土]]を剥ぎ取って戻す施工とし、盛土部は[[心土破砕]]を行う。整備後は土壌調査により是正の要否を判定し、必要に応じ客土や有機物の投入を行う。盛土部は初期の数年、収量を追跡する。'),
    c('risk','リスク② 省力化施設の保守という新たな負担と対策は？',
      '地下水位制御システムや自動給水栓は、暗渠の目詰まりや制御装置の点検という新たな管理を生む。一方で集積が進むほど共同管理の担い手は減るリスクがある。対策として、点検の手順と時期を[[機能保全計画]]に位置付け、{{多面的機能支払}}を活用して作業を共同活動に組み込む。費用の分担は{{水土里ビジョン}}に位置付ける。'),
    c('risk','リスク③ 整備データの陳腐化と対策は？',
      '座標データは、その後の補修や水路の付替えを反映しなければ実際の地形とずれ、自動走行の精度を損なうリスクがある。対策として、更新の担当と時期を定め、土地改良区が保管する[[施設台帳]]と併せて管理し、更新の頻度は補修の実績に応じ、履歴は換地図と併せて保管する。'),
    c('mensetsu','集積と集約化は同じ意味だと思っていましたが、違うのですか。',
      'この答案では区別して使っている。集積は農地の利用権を担い手に集めること、集約化はその農地を面的にまとまった形に配置し直すことを指す。利用権の調整だけでも集積は進むが、分散したままでは移動や畦畔管理の負担が残るため、換地と一体で集約化まで行うことを解決策の柱にしている。'),
    c('mensetsu','整備データが陳腐化するリスクへの対策は、具体的に誰が担うのですか。',
      '更新の担当と時期をあらかじめ定め、土地改良区が保管する施設台帳と併せて管理する体制にしている。補修や水路の付替えが生じた際にはその実績に応じて更新頻度を見直し、履歴を換地図と併せて保管することで、データと実際の地形のずれを防ぐ考え方である。')
  ])},
  {id:'sentaku3-09', subject:'sentaku3', title:'09 R7Ⅲ-1 基幹施設から末端の用排水路までの保全管理', sub:'最重要課題: 保全管理を担う力の確保', cards: docCards([
    c('jyoken','計画的な補修・更新\n\n内容と根拠データは？',
      '基幹的農業水利施設は標準耐用年数を超過したものが約[[6割]]を占め、突発事故は年間約[[1,900件]]に上る。頭首工の漏水やパイプラインの破損など、社会的な影響の大きい事故も生じている。早急な対策が必要な基幹的水路は約[[4,200km]]に及ぶが、今後5年間で更新に着手するのは約[[1,100km]]にとどまる。そのため、[[農業水利施設の維持管理]]の観点から、[[更新需要に投資が追いつかない中で必要な機能を確保し続けること]]が課題である。'),
    c('jyoken','保全管理を担う力の確保\n\n内容と根拠データは？',
      '末端の用排水路は地域住民により維持管理されているが、農業者の高齢化・減少、[[農村の混住化]]、[[土地持ち非農家]]の増加により、共同活動の継続が困難となりつつある。また専任職員が不在の土地改良区は約[[5割]]を占める。そのため、[[農村社会の持続性]]の観点から、[[人的資源が減少する下でも基幹から末端までの保全管理を継続できる状態の確保]]が課題である。'),
    c('jyoken','被災への備え\n\n内容と根拠データは？',
      '集中豪雨や大規模地震のリスクが高まる中、老朽化した施設ほど被災の可能性は高い。大規模災害時には農業水利施設にとどまらず、道路や電力などの[[農村インフラ]]も被災し、復旧の制約となる。そのため、[[防災・減災]]の観点から、[[被災を前提に機能を早期回復できる状態の確保]]が課題である。'),
    c('saijuyo','なぜ「保全管理を担う力の確保」が最重要課題か？',
      '①の計画的な維持も③の早期復旧も、日々点検と操作を行う主体がいなければ実行に移らない。不足する人的資源は[[土地改良区の合併・広域化]]でも補いうるが、合意に時間を要し末端の日常管理までは埋まらない。技術で人手を減らし、担い手を広げる方策を軸に据える。'),
    c('kaiketsu','解決策① ICT・AI診断による調査の効率化とは？',
      '限られた職員数でも状態を把握するため、機能診断を効率化する。水路には[[ドローン]]や[[管内調査機器]]を用い、画像から{{健全度指標}}を判定する技術を組み合わせて、職員の経験に依存しない評価を行う。判定は近接目視による抜き取り検証と併用する。これにより、少ない人員でも基幹から末端までの状態把握を継続できる。'),
    c('kaiketsu','解決策② 管理主体の多様化と広域化とは？',
      '保全管理を土地改良区と地域住民のみに依存する構造を改める。[[県・市町村]]や[[民間企業]]と役割分担を定め、複数の土地改良区で保守を共同化する。{{多面的機能支払}}を活用し、地域住民による点検と軽微な補修を活動に位置付ける。これにより、担い手が減少しても保全管理の実施体制を維持できる。'),
    c('kaiketsu','解決策③ 管理水準の階層化と対策の優先順位づけとは？',
      'すべての施設を同水準で管理することは人的にも財政的にも成り立たない。施設の重要度と被災時の影響に応じ、基幹施設は[[予防保全]]、影響の小さい施設は[[事後保全]]とするなど管理水準を区分する。区分と役割は{{水土里ビジョン}}に位置付ける。これにより、限られた力を重要な施設に集中し、保全管理を継続できる。'),
    c('risk','リスク① 現場の作業能力の低下と対策は？',
      '調査の省力化は、技術者が現場で体験的に学ぶ機会を減らし、人の目による確認の機能を弱める懸念がある。対策として、共同保守の枠組みに、[[熟練者と若手が同行する実地点検]]を年次計画として組み込む。診断結果は経験を積んだ技術者による確認を併用し、新技術に過度に依存しない体制とする。'),
    c('risk','リスク② 判定のばらつきと説明責任と対策は？',
      'AIによる劣化度の判定は学習データに依存し、施設の種別や環境が変われば精度が落ちる。優先順位を下げた施設で事故が生じた際に、判断の根拠を示せない懸念がある。対策として、判定の基準と閾値をあらかじめ文書化し、[[抜き取りの近接目視]]で妥当性を検証したうえで、判断の経過を記録として残す。'),
    c('risk','リスク③ 管理主体の多様化に伴う責任分界の不明確化と対策は？',
      '県・市町村や民間企業、住民が保全管理に加わると、点検の範囲と事故時の対応の責任が曖昧になり、異常の情報が引き継がれない懸念がある。対策として、施設ごとに[[管理区分]]と[[連絡経路]]を定めた協定を結び、点検記録を共通様式で一元的に蓄積する。'),
    c('mensetsu','AIによる劣化判定を導入すると、技術者の経験が不要になってしまうのではないですか。',
      'そうではなく、AI診断は職員の経験に依存しない評価を可能にする補助であり、近接目視による抜き取り検証を併用する前提にしている。また現場の作業能力が低下する懸念に対しては、熟練者と若手が同行する実地点検を年次計画に組み込み、技術の継承と新技術の活用を両立させる考え方である。'),
    c('mensetsu','管理主体を多様化すると、誰が責任を持つのか曖昧になりませんか。',
      'その懸念をリスクとして明記しており、対策として施設ごとに管理区分と連絡経路を定めた協定を結ぶことにしている。点検記録も共通様式で一元的に蓄積することで、複数主体が関わっても異常の情報が引き継がれる体制を作る考え方である。')
  ])},
  {id:'sentaku3-10', subject:'sentaku3', title:'10 R7Ⅲ-2 環境負荷の低減(温室効果ガスの排出削減)', sub:'最重要課題: 水田由来の温室効果ガスの削減', cards: docCards([
    c('jyoken','水田由来の温室効果ガスの削減\n\n内容と根拠データは？',
      '我が国の農林水産分野の温室効果ガス排出量は[[5,103万t-CO2]]であり、うち稲作が[[25.3%]]を占める。基本計画は令和12年度に農業分野で[[1,176万t-CO2]]を削減するとしているが、{{中干し期間の延長}}の実施面積は環境保全型農業直接支払の[[4.1%]]にとどまる。そのため、[[気候変動緩和]]の観点から、[[基盤整備を通じて水田からのメタン排出を減らせる状態の確保]]が課題である。'),
    c('jyoken','農業水利施設のエネルギー消費の削減\n\n内容と根拠データは？',
      '用排水機場は電力を多く消費し、その使用量に対する小水力等の発電割合は[[37%以上]]が目標とされている。一方、労務単価は約[[18%]]、建設資材価格は約[[23%]]上昇し、更新費と管理費の双方が増している。そのため、[[資源循環]]の観点から、[[施設の更新の機会をとらえて電力消費と排出を減らし、あわせて管理費を抑えられる状態の確保]]が課題である。'),
    c('jyoken','生物多様性との両立と取組の継続\n\n内容と根拠データは？',
      '環境保全型農業直接支払の実施面積は[[9万1千ha]]であり、みどり戦略が掲げる有機農業[[25%]]の目標には遠い。また、排出削減の過程で新たな環境負荷が生じないよう留意する必要がある。そのため、[[環境調和]]の観点から、[[排出削減の取組が生物多様性や営農と両立し、地域で継続できる状態の確保]]が課題である。'),
    c('saijuyo','なぜ「水田由来の温室効果ガスの削減」が最重要課題か？',
      '②の省エネも③の両立も、排出量の四分の一を占める稲作に手を付けなければ削減目標には届かない。削減は{{資材投入型}}によっても図れるが、原料の確保と費用が制約となる。基盤整備で担保できる水管理を軸に据える。'),
    c('kaiketsu','解決策① 用排水分離と自動給水栓による水管理の制御とは？',
      '用水系統と排水系統を分離し、圃場ごとに湛水深と落水の時期を独立して制御できるようにする。[[自動給水栓]]と[[自動落水栓]]、水位センサを設置し、中干し期間の延長を営農の負担を増やさずに行えるようにする。{{地下水位制御システム}}を併用し、落水後の地耐力も確保する。これにより、収量を保ちながら水田からのメタン排出を減らせる。'),
    c('kaiketsu','解決策② 秋耕を可能にする排水条件の整備とは？',
      '稲わらを湛水下で分解させると翌春にメタンが発生する。[[暗渠排水]]と地下水位制御により収穫後の地下水位を下げ、秋のうちに稲わらをすき込む[[秋耕]]を可能とする。好気的な条件下での分解を促進し、翌春の湛水時の発生量を抑える。あわせて[[バイオ炭]]や堆肥の施用による土壌への炭素貯留を進める。これにより、営農の作業体系の中で排出を減らせる。'),
    c('kaiketsu','解決策③ 削減の効果を測り経済的に還元する仕組みとは？',
      '自動水管理システムから湛水深と落水時期の記録を取得し、[[J-クレジット]]制度の方法論に沿って削減量を算定できる形で保管する。算定した削減量をクレジットとして販売し、機器の更新費に充てる。算定の対象と期間は事業計画に明記する。これにより、削減の取組が農業者の収入につながり、地区に定着する。'),
    c('risk','リスク① 中干しの延長に伴う収量と生態系への影響と対策は？',
      '落水期間が延びると根の活力低下による減収や、水生生物の生育の中断を招く懸念がある。対策として、延長の日数は土壌の種類と地下水位から圃場ごとに定め、導入初期は一部の圃場で試行して収量と生物の生息状況を追跡する。結果に応じて日数を修正し、[[カエル類の変態期]]を避ける配慮も併せて行う。'),
    c('risk','リスク② 地区内の還元水量の減少と対策は？',
      '用排水分離と落水の制御は、地区内からの[[還元水量]]を減らす。これを反復利用してきた下流地区の用水計画が成立しなくなる懸念がある。対策として、流域単位で[[水収支]]を再計算し、取水量と番水の計画を見直す。既設の調整池の運用を変え、時間差を吸収する。'),
    c('risk','リスク③ 算定の信頼性と機器の保守と対策は？',
      '削減量の算定は計測記録に依存するため、機器の故障や欠測により信頼性を欠く懸念がある。対策として、計測機器の[[校正]]の頻度と欠測時の補完方法をあらかじめ定め、[[第三者による検証]]を受ける。保守は複数の土地改良区で共同化する。'),
    c('mensetsu','J-クレジットとして販売する削減量は、本当に正確に測れるのですか。',
      'その信頼性への懸念は認識しており、計測機器の校正頻度と欠測時の補完方法をあらかじめ定め、第三者による検証を受けることを対策としている。機器の故障や欠測が生じても算定の信頼性を保てるよう、保守を複数の土地改良区で共同化する体制も組み合わせている。'),
    c('mensetsu','中干し期間を延長すると、下流の水生生物への影響もあるのではないですか。',
      '水生生物への影響は生態系への懸念として認識しており、延長日数を圃場ごとに定めた上で、導入初期は一部の圃場で試行し、収量と生物の生息状況を追跡することにしている。カエル類の変態期を避ける配慮も組み込み、結果に応じて日数を修正する順応的な進め方である。')
  ])},
  {id:'sentaku3-11', subject:'sentaku3', title:'11 R8Ⅲ-1 既成かんがい地域の用水の安定確保', sub:'最重要課題: 需給の整合の確保', cards: docCards([
    c('jyoken','水管理の省力化\n\n内容と根拠データは？',
      '経営規模の拡大や栽培方法の多様化により、水需要は時期的・量的に変化している。基幹的農業従事者は[[240万人]]から[[103万人]]へ半数未満に減少し、65歳以上が[[7割]]である。開水路主体の水利システムは頻繁な人手の操作を前提とし、広域に分散した農地を少人数では管理しきれない。そのため、[[労働力の制約]]の観点から、[[管理主体が減少しても日々の配水を継続できる状態の確保]]が課題である。'),
    c('jyoken','需給の整合の確保\n\n内容と根拠データは？',
      '既成のかんがい施設は、整備当時の作付けを前提に用水量が算定されている。しかし、農地集積に加え、今後5年間で畑地かんがい約[[2.4万ha]]の整備が計画されており、必要な時期と水量は当時と異なる。そのため、[[水利用]]の観点から、[[当初計画と実需要の乖離を解消し、必要な水量を必要な時期に届けられる状態の確保]]が課題である。'),
    c('jyoken','管理費用と役割の分担\n\n内容と根拠データは？',
      '人口減少・高齢化により集落の共同活動による維持管理は困難となる一方、施設の老朽化により管理コストは増加している。土地改良区は約[[7割]]が受益面積[[300ha未満]]と小規模で賦課金収入が乏しく、専任職員を置けないものが約[[5割]]に上る。そのため、[[農村社会の持続性]]の観点から、[[関係者間で役割と費用の分担を明確化し、地域一体で管理を継続できる状態の確保]]が課題である。'),
    c('saijuyo','なぜ「需給の整合の確保」が最重要課題か？',
      '①の省力化投資も③の費用分担も、必要水量が実態とずれていれば規模と負担の根拠を誤る。なお、乖離の解消は[[水源の新規開発]]でも可能だが、水利権の調整と事業費の制約が大きい。既存施設の再評価と運用高度化を軸に据える。'),
    c('kaiketsu','解決策① 用水量の再算定とかんがい計画の変更とは？',
      '現況と将来の営農計画に基づき用水量を再算定する。水田では作付け体系、[[代掻き期の重複]]、[[減水深]]と[[還元水量]]を実測により見直し、ピーク時用水量を再設定する。畑地化した区域では[[消費水量法]]により計画用水量を算定し、水田用水との時期のずれから系統ごとの必要水量を定める。これにより施設更新の投資規模の根拠が確定し、過不足のない安定的な供給が可能となる。'),
    c('kaiketsu','解決策② 配水管理の高度化による需給の調整とは？',
      '算定した需要に対し配水の応答性を高める。開水路系では[[上流水位制御]]から[[下流水位制御]]への転換や調整池により需給の時間差を吸収する。末端では自動給水栓やICT水管理システムを導入し、水位センサに基づく配水を行う。導入は施設の重要度と管理体制に応じ優先順位を定め段階的に行う。これにより需要への追随性が高まり、少人数でも安定供給を維持できる。'),
    c('kaiketsu','解決策③ 用水系統の再編と水源の多角化とは？',
      '施設更新の機会に、用水系統そのものを組み替える。老朽化施設の集約・再編とあわせ必要な区間を管路化し、[[圧力配水]]により配水の自由度を高める。また、[[排水の反復利用]]や地区間の水融通のための連絡管を整備し、渇水時の供給力を確保する。落差のある地域では[[小水力発電]]で電力費を軽減する。これにより水源と系統に冗長性が生まれ、渇水年や事故時も供給を継続できる。'),
    c('risk','リスク① 既得の水利慣行との齟齬と対策は？',
      '用水計画の変更は配水量や取水の順序を変える。このため水利慣行との齟齬を生み、受益者間に不公平感が生じるリスクがある。対策として水量の計算根拠を公開し、手順と経過を明示した協議を重ねて段階的に移行する。移行中は流量を実測して効果を検証し、配分を修正する。'),
    c('risk','リスク② 管理の高度化に伴う技術者の不足と対策は？',
      '自動制御や遠方監視の導入は、機器の保守や制御設定という技術を管理者に求める。専任職員が不在の土地改良区では対応できず、機器が形骸化するリスクがある。対策として研修と技術支援の体制を整え、複数の土地改良区や市町村が連携した保守体制を整備する。'),
    c('risk','リスク③ 将来の維持管理費の増加と対策は？',
      '施設や機器の高度化は更新費と電力費の増加を招き、維持管理コストが再び増大するリスクがある。対策として{{LCC評価}}で仕様を比較して機種を定めるとともに、{{水土里ビジョン}}に位置付けた費用分担の下で[[更新積立金制度]]を確立し、将来費用を平準化する。'),
    c('mensetsu','用水量を再算定した結果、必要な水量が当初より減った場合はどうなりますか。',
      '水量が減った系統では管路の口径や施設規模を縮小して更新でき、投資規模そのものを抑えられる。逆に畑地かんがいの拡大などで水量が増えた系統には重点的に投資する、というように再算定の結果を施設更新の投資配分の根拠として使う考え方である。'),
    c('mensetsu','水源の新規開発ではなく既存施設の再評価を選んだのはなぜですか。',
      '水源の新規開発は水利権の調整と事業費の制約が大きく、実現までに時間がかかるためである。既存施設の再評価と運用高度化であれば、更新の機会をとらえて段階的に進められ、需給の整合という最重要課題により早く対応できると判断した。')
  ])},
  {id:'sentaku3-12', subject:'sentaku3', title:'12 R8Ⅲ-2 豪雨に対応した農地・農業水利施設の防災・減災', sub:'最重要課題: 流域での流出抑制', cards: docCards([
    c('jyoken','排水機能の確保\n\n内容と根拠データは？',
      '1時間降水量50mm以上の年間発生回数は、昭和51〜60年の約[[226回]]に対し、直近10年は約[[330回]]と約[[1.5倍]]に増加している。一方、既設の排水施設は過去の実績降雨に基づき計画されており、設計外力を超える降雨に対して能力が不足している。そのため、[[気候変動適応]]の観点から、[[将来の降雨を見込んだ排水能力の確保]]が課題である。'),
    c('jyoken','流域での流出抑制\n\n内容と根拠データは？',
      '流域全体での水害軽減が求められる中、農地や農業水利施設の多面的機能の活用が期待されている。しかし水田の雨水貯留の取組面積は、水田面積の[[23.5%]]に達する[[北海道]]に対し、[[北海道以外]]では[[2.2%]]にとどまる。水田での貯留やダムの事前放流は有効だが、湿害リスクや渇水時の利水への影響について、農業者や管理者の懸念が払拭されていない。そのため、[[国土保全]]の観点から、[[営農の安定性を確保しつつ、流域の洪水ピークを農地・農業水利施設の側で分担して低減させること]]が課題である。'),
    c('jyoken','被害の最小化\n\n内容と根拠データは？',
      '激甚化する豪雨では、ハード対策のみでの被害抑制には限界がある。さらに水門等の管理者の減少により巡視・操作の体制も弱まっている。そのため、[[危機管理]]の観点から、[[危険の予測と情報共有により、能力を超える降雨が生じた場合にも被害を最小化できる状態の確保]]が課題である。'),
    c('saijuyo','なぜ「流域での流出抑制」が最重要課題か？',

function shuffleArr(arr){
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function topicDecksFor(subjectId){
  return decks.filter(function(d){ return d.subject === subjectId; });
}

var weakSet = new Set();
var quizCache = {};

function buildAllDeck(subjectId){
  var topics = topicDecksFor(subjectId);
  var cards = [];
  topics.forEach(function(d){ cards = cards.concat(d.cards); });
  return {id: subjectId + '-all', subject: subjectId, title: '全体シャッフル(全' + cards.length + '枚)', cards: cards};
}
function buildWeakDeck(subjectId){
  var all = buildAllDeck(subjectId);
  var cards = all.cards.filter(function(cd){ return weakSet.has(cd.id); });
  return {id: subjectId + '-weak', subject: subjectId, title: '苦手カード(' + cards.length + ')', cards: cards};
}
function buildQuizDeck(subjectId){
  if (!quizCache[subjectId]){
    var all = buildAllDeck(subjectId);
    quizCache[subjectId] = shuffleArr(all.cards).slice(0, Math.min(10, all.cards.length));
  }
  return {id: subjectId + '-quiz', subject: subjectId, title: '🎲 抜き打ち10問', cards: quizCache[subjectId]};
}
function weaknessScore(cardId){
  var t = cardTallyFor(cardId, currentMode);
  var total = t.ok + t.meh + t.bad;
  if (total === 0) return { score: 0.5, total: 0 };
  return { score: (t.bad * 2 + t.meh * 1) / total, total: total };
}
function buildWeakPriorityDeck(subjectId){
  var all = buildAllDeck(subjectId);
  var scored = all.cards.map(function(cd){
    var w = weaknessScore(cd.id);
    return { card: cd, score: w.score, total: w.total };
  }).filter(function(x){ return x.total === 0 || x.score > 0; });
  scored.sort(function(a, b){ return b.score - a.score; });
  var cards = scored.map(function(x){ return x.card; });
  return {id: subjectId + '-priority', subject: subjectId, title: '🎯 弱点優先復習(' + cards.length + ')', cards: cards};
}
function getDeckList(subjectId){
  return [buildAllDeck(subjectId), buildWeakDeck(subjectId), buildQuizDeck(subjectId), buildWeakPriorityDeck(subjectId)].concat(topicDecksFor(subjectId));
}

var WEEKDAY_LABELS_MON_FIRST = ['月', '火', '水', '木', '金', '土', '日'];
function todayRecommendedDeck(subjectId){
  var topics = topicDecksFor(subjectId);
  if (topics.length === 0) return null;
  var mondayBased = (new Date().getDay() + 6) % 7;
  var idx = mondayBased % topics.length;
  var target = topics[idx];
  var dl = getDeckList(subjectId);
  var listIndex = dl.findIndex(function(d){ return d.id === target.id; });
  return { deck: target, listIndex: listIndex, weekdayLabel: WEEKDAY_LABELS_MON_FIRST[mondayBased] };
}

function sessionKey(subj, mode){ return subj + ':' + mode; }
var sessions = {};
var savedProgressMap = {};

function ensureSession(subj, mode){
  var key = sessionKey(subj, mode);
  if (sessions[key]) return sessions[key];
  var dl = getDeckList(subj);
  var n = dl[0].cards.length;
  var ord = []; for (var i = 0; i < n; i++) ord.push(i);
  var sess = { deckIdx: 0, order: ord, pos: 0, visited: new Set() };
  var saved = savedProgressMap[key];
  if (saved){
    var idx = dl.findIndex(function(d){ return d.id === saved.deckId; });
    if (idx === -1) idx = 0;
    sess.deckIdx = idx;
    var cards = dl[idx].cards;
    var nn = cards.length;
    var ord2 = []; for (var j = 0; j < nn; j++) ord2.push(j);
    sess.order = ord2;
    var foundPos = cards.findIndex(function(cd){ return cd.id === saved.cardId; });
    sess.pos = (nn > 0 && foundPos >= 0) ? foundPos : 0;
    sess.visited = new Set(saved.visited || []);
  }
  sessions[key] = sess;
  return sess;
}

function escapeAttr(s){
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderCardText(text, cardId, clozeMode){
  var re = /\[\[([^\]]+)\]\]|\{\{([^}]+)\}\}/g;
  var html = '';
  var lastIndex = 0;
  var blankIdx = 0;
  var m;
  while ((m = re.exec(text)) !== null){
    html += escapeHtml(text.slice(lastIndex, m.index));
    if (m[1] !== undefined){
      if (clozeMode){
        var key = cardId + '-b' + blankIdx;
        var val = m[1];
        if (revealed.has(key)){
          html += '<span class="fc-blank revealed" data-key="' + key + '">' + escapeHtml(val) + '</span>';
        } else {
          var blankLen = Math.max(3, Math.min(10, Math.round(val.length / 1.6)));
          html += '<span class="fc-blank" data-key="' + key + '">' + new Array(blankLen + 1).join('▁') + '</span>';
        }
        blankIdx++;
      } else {
        html += escapeHtml(m[1]);
      }
    } else if (m[2] !== undefined){
      var term = m[2];
      html += '<span class="fc-term" data-term="' + escapeAttr(term) + '">' + escapeHtml(term) + '</span>';
    }
    lastIndex = re.lastIndex;
  }
  html += escapeHtml(text.slice(lastIndex));
  return html;
}

/* ---------- persistence ---------- */

var storageBackend = null; /* 'artifact' | 'local' | 'none' */
var LS_PREFIX = 'fc-gijutsushi:';

function detectStorageBackend(maxTries, intervalMs){
  return new Promise(function(resolve){
    var tries = 0;
    (function check(){
      if (window.storage){ resolve('artifact'); return; }
      tries++;
      if (tries >= maxTries){
        try {
          var testKey = LS_PREFIX + '__test__';
          localStorage.setItem(testKey, '1');
          localStorage.removeItem(testKey);
          resolve('local');
        } catch (e){ resolve('none'); }
        return;
      }
      setTimeout(check, intervalMs);
    })();
  });
}

function storageGet(key){
  if (storageBackend === 'artifact'){
    return window.storage.get(key, false)
      .then(function(res){ return (res && res.value) ? res.value : null; })
      .catch(function(){ return null; });
  }
  if (storageBackend === 'local'){
    try { return Promise.resolve(localStorage.getItem(LS_PREFIX + key)); }
    catch (e){ return Promise.resolve(null); }
  }
  return Promise.resolve(null);
}
function storageSet(key, value){
  if (storageBackend === 'artifact') return window.storage.set(key, value, false).catch(function(){});
  if (storageBackend === 'local'){
    try { localStorage.setItem(LS_PREFIX + key, value); } catch (e){}
  }
  return Promise.resolve();
}

  });
}

function allBackupKeys(){
  var keys = ['weak-cards', 'fc-completions', 'fc-ratings', 'fc-totals', 'fc-last-mode', 'fc-last-subject', 'fc-edits'];
  SUBJECTS.forEach(function(s){ ['full', 'cloze'].forEach(function(m){ keys.push('fc-progress-' + s.id + '-' + m); }); });
  return keys;
}

function exportBackup(){
  var keys = allBackupKeys();
  Promise.all(keys.map(function(k){ return storageGet(k).then(function(v){ return { k: k, v: v }; }); })).then(function(results){
    var data = {};
    results.forEach(function(r){ if (r.v !== null) data[r.k] = r.v; });
    var payload = { version: 1, exportedAt: new Date().toISOString(), data: data };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'gijutsushi-backup-' + todayDateStr() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  });
}

function importBackupFile(file){
  var reader = new FileReader();
  reader.onload = function(){
    var payload;
    try { payload = JSON.parse(reader.result); } catch (e){ payload = null; }
    var data = payload && payload.data ? payload.data : null;
    if (!data){ alert('バックアップファイルの形式が正しくありません。'); return; }
    if (!confirm('現在のデータを、このバックアップの内容で上書きします。よろしいですか？')) return;
    var keys = Object.keys(data);
    Promise.all(keys.map(function(k){ return storageSet(k, data[k]); })).then(function(){
      alert('復元しました。ページを再読み込みします。');
      location.reload();
    });
  };
  reader.readAsText(file);
}

function markVisitedCurrent(){
  var deck = currentDeck();
  if (!state.order.length) return;
  var card = deck.cards[state.order[state.pos]];
  if (!card) return;
  state.visited.add(card.id);

  if (deck.cards.length > 0 && state.visited.size >= deck.cards.length){
    var key = deck.id + ':' + currentMode;
    completions[key] = (completions[key] || 0) + 1;
    saveCompletions();
    state.visited = new Set([card.id]);
  }
}

function rateCurrent(grade){
  var deck = currentDeck();
  if (!state.order.length) return;
  var card = deck.cards[state.order[state.pos]];
  if (!card) return;
  var key = card.id + ':' + currentMode;
  if (!ratings[key]) ratings[key] = { ok: 0, meh: 0, bad: 0 };
  ratings[key][grade]++;
  saveRatings();

  totalReviews++;
  var today = todayDateStr();
  dailyLog[today] = (dailyLog[today] || 0) + 1;
  saveTotals();

  if (deck.id === currentSubject + '-priority'){
    var refreshed = getDeckList(currentSubject)[state.deckIdx];
    var n = refreshed.cards.length;
    var newOrder = []; for (var i = 0; i < n; i++) newOrder.push(i);
    state.order = newOrder;
    var foundIdx = refreshed.cards.findIndex(function(cd){ return cd.id === card.id; });
    state.pos = n > 0 ? (foundIdx >= 0 ? foundIdx : Math.min(state.pos, n - 1)) : 0;
  }

  render();
  var btn = document.querySelector('.fc-rate-btn[data-grade="' + grade + '"]');
  if (btn){
    btn.classList.add('flash');
    setTimeout(function(){ btn.classList.remove('flash'); }, 250);
  }
}

function wrapSelectionAsBlank(){
  var ta = document.getElementById('fc-edit-back');
  var s = ta.selectionStart, e = ta.selectionEnd;
  if (s === e){ alert('空欄にしたい文字をドラッグして選択してから押してください。'); return; }
  var val = ta.value;
  var selected = val.slice(s, e);
  ta.value = val.slice(0, s) + '[[' + selected + ']]' + val.slice(e);
  ta.focus();
  ta.setSelectionRange(s, s + selected.length + 4);
}

function unwrapSelectionBlank(){
  var ta = document.getElementById('fc-edit-back');
  var s = ta.selectionStart, e = ta.selectionEnd;
  var val = ta.value;
  var selected = val.slice(s, e);
  if (selected.length >= 4 && selected.slice(0, 2) === '[[' && selected.slice(-2) === ']]'){
    var inner = selected.slice(2, -2);
    ta.value = val.slice(0, s) + inner + val.slice(e);
    ta.focus();
    ta.setSelectionRange(s, s + inner.length);
  } else {
    alert('選択範囲が [[ ]] で囲まれていません。[[ ]] を含めて選択してください。');
  }
}

function toggleWeakCurrent(){

  var card = deck.cards[state.order[state.pos]];

  if (weakSet.has(card.id)) weakSet.delete(card.id); else weakSet.add(card.id);
  saveWeakIds();
  if (currentDeck().id === currentSubject + '-weak'){
    var n = buildWeakDeck(currentSubject).cards.length;
    state.order = [];
    for (var i = 0; i < n; i++) state.order.push(i);
    if (state.pos >= n) state.pos = Math.max(0, n - 1);
    flipped = false;
    revealed = new Set();
  }
  render();
  saveProgress();
}

  if (currentDeck().id === currentSubject + '-weak') { loadDeck(state.deckIdx, true); saveProgress(); }
  else render();
}
